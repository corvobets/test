function letters(str, spacing = 0, ctx = c) {

function rrect(x, y, w, h, r, ctx = c) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function limeGrad(y0, y1, ctx = c) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);

function violetGrad(y0, y1, ctx = c) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);

function bgGlow(a, x = cx, y = cy, r = Math.max(W, H) * .75) {
  if (a <= 0) return;

  c.fillStyle = g; full();
}
function rays(t, a, n = 18, x = cx, y = cy, speed = .12) {
  if (a <= 0) return;
  c.save(); c.translate(x, y); c.rotate(t * speed);
  const g = c.createRadialGradient(0, 0, 0, 0, 0, DIAG * .6);
  g.addColorStop(0, LIME(a)); g.addColorStop(1, LIME(0));
  c.fillStyle = g;
  for (let i = 0; i < n; i++) {
    const a0 = i / n * Math.PI * 2;
    c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, DIAG, a0, a0 + Math.PI / n * .5); c.closePath(); c.fill();
  }
  c.restore();
}
const rD = mulberry32(7);
const DUST = Array.from({ length: 120 }, () => ({ x: rD(), y: rD(), z: .25 + rD() * .75, ph: rD() * 6.28 }));
function dust(t, a) {
  if (a <= 0) return;
  c.save(); c.globalCompositeOperation = 'lighter';

    c.beginPath(); c.arc(x, y, (1 + 2.6 * d.z) * U, 0, 7); c.fill();
  }
  c.restore();
}

const HITS = [[0.95, 12], [2.0, 22], [2.5, 12], [3.0, 12], [3.5, 12], [5.4, 26], [7.5, 10], [10.3, 22], [11.0, 14], [12.5, 30]];

function shake(t) {
  let x = 0, y = 0, r = 0;
  for (const [ti, a] of HITS) {
    const d = t - ti; if (d < 0 || d > .7) continue;

/* 2.0 – 4.0  |  kinetic words on the beat */

/* 7.5 – 11.0  |  TOP 10 leaderboard: TU sobes de 10.º a 1.º */
const rL = mulberry32(99);

  }

    if (mode === 'fill') { c.fillStyle = col; c.fillText(w, x, y); }
    else if (mode === 'gold') { c.fillStyle = limeGrad(y - size * .73, y); c.fillText(w, x, y); }
    else { c.strokeStyle = col; c.lineWidth = 3 * U; c.strokeText(w, x, y); }
  });
  c.restore();
}

/* 12.5 – 15.0  |  end card */
function S6(t) {
  c.fillStyle = P.bg; full();
  const emS = (PORT ? 380 : 250) * U;
  const nameS = fit('CORVO BETS', 'Anton', 400, W * (PORT ? .84 : .5), (PORT ? 180 : 150) * U);
  const rewS = nameS * .4, g = 26 * U, pillH = 84 * U, urlS = 34 * U;
  const stackH = emS + g * 1.2 + nameS * .73 + g * .9 + rewS * .73 + g * 2 + pillH + g * 1.3 + urlS;
  let y = cy - stackH / 2 - g * .8;
  const emY = y + emS / 2; y += emS + g * 2.8;
  const nameY = y + nameS * .73 / 2; y += nameS * .73 + g * .9;
  const rewY = y + rewS * .73 / 2; y += rewS * .73 + g * 2;
  const pillY = y + pillH / 2; y += pillH + g * 1.3;
  const urlY = y + urlS / 2;

  bgGlow(1.3 + 1.2 * Math.exp(-t * 3), cx, emY);
  rays(t + 12.5, .08, 24, cx, emY, .15);
  dust(t + 12.5, 1);
  for (let k = 0; k < 3; k++) {                     // shockwaves
    const d = t - k * .09, p = eOutExpo(prog(d, 0, 1.1));
    if (p <= 0 || p >= 1) continue;
    c.strokeStyle = k === 1 ? WHITE(.5 * (1 - p)) : LIME(.7 * (1 - p)); c.lineWidth = (10 - k * 3) * U * (1 - p) + 1;
    c.beginPath(); c.arc(cx, emY, p * DIAG * .7, 0, 7); c.stroke();
  }
  const es = eOutBack(prog(t, 0, .6), 2.2);
  if (es > 0) {
    const [px, py] = ballBase(cx, emY, emS);
    pedestal(px, py, emS * .85 * eOutExpo(prog(t, 0, .7)), prog(t, 0, .15), t);
    const drop = (1 - eOutCubic(prog(t, 0, .45))) * -120 * U;
    logo(cx + (1 - es) * (px - cx), emY + drop + (1 - es) * (py - emY), emS * es, { glow: 45 });
  }
  flare(...eyePos(cx, emY, emS), Math.max(0, 1 - Math.abs(t - .55) / .3) * .9);

  // name
  font(nameS); c.textAlign = 'center';
  const N = 'CORVO BETS', L = letters(N, nameS * .02);
  c.save(); c.beginPath(); c.rect(0, nameY - nameS * .45, W, nameS * .9); c.clip();
  for (let i = 0; i < N.length; i++) {
    const p = eOutExpo(prog(t, .18 + i * .025, .18 + i * .025 + .5));
    c.fillStyle = P.white;
    c.fillText(N[i], cx - L.total / 2 + L.xs[i] + L.ws[i] / 2, nameY + nameS * CAP + (1 - p) * nameS);
  }
  c.restore();
  // REWARDS
  const rp = eOutExpo(prog(t, .4, 1.1));
  if (rp > 0) {
    font(rewS); const sp = lerp(1.1, .5, rp) * rewS; c.letterSpacing = sp + 'px';
    c.globalAlpha = rp; c.fillStyle = violetGrad(rewY - rewS * .4, rewY + rewS * .4);
    c.fillText('REWARDS', cx + sp / 2, rewY + rewS * CAP);
    c.globalAlpha = 1; c.letterSpacing = '0px';
    // flanking rules
    const tw = (c.measureText('REWARDS').width + 7 * sp) / 2 + 18 * U, rl = 90 * U * rp;
    font(rewS); c.fillStyle = P.violet;
    c.fillRect(cx - tw - rl - (7 * sp) * 0, rewY - 1.5 * U, rl, 3 * U);
    c.fillRect(cx + tw - 0, rewY - 1.5 * U, rl, 3 * U);
  }
  // CTA pill
  const pp = eOutBack(prog(t, .75, 1.1), 2);
  if (pp > 0) {
    font(36 * U, 'Inter', 800); c.letterSpacing = 5 * U + 'px';
    const label = 'JUNTA-TE JÁ  →', tw = c.measureText(label).width + 90 * U;
    const pulse = 1 + .035 * Math.max(0, Math.sin((t - 1.1) * 7)) * prog(t, 1.1, 1.3);
    c.save(); c.translate(cx, pillY); c.scale(pp * pulse, pp * pulse);
    c.shadowColor = LIME(.8); c.shadowBlur = 40 * U;
    c.fillStyle = limeGrad(-pillH / 2, pillH / 2); rrect(-tw / 2, -pillH / 2, tw, pillH, pillH / 2); c.fill();
    c.shadowBlur = 0; c.fillStyle = P.ink; c.textAlign = 'center'; c.fillText(label, 2.5 * U, 13 * U);
    // sheen
    const sx = lerp(-tw, tw, prog(t, 1.3, 1.9));
    c.save(); rrect(-tw / 2, -pillH / 2, tw, pillH, pillH / 2); c.clip();
    const sg = c.createLinearGradient(sx - 60 * U, 0, sx + 60 * U, 0);
    sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(.5, 'rgba(255,255,255,.55)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = sg; c.fillRect(sx - 60 * U, -pillH, 120 * U, pillH * 2); c.restore();
    c.restore(); c.letterSpacing = '0px';
  }
  // URL typing
  const url = 'corvobetsrewards.com', n = Math.floor(prog(t, 1.0, 1.55) * url.length);
  if (t > .95) {
    font(urlS, 'JBM', 700); c.textAlign = 'left';
    const fw = c.measureText(url).width, ux = cx - fw / 2;
    c.fillStyle = P.white; c.fillText(url.slice(0, n), ux, urlY + urlS * .36);
    const cw = c.measureText(url.slice(0, n)).width;
    if (Math.floor(t * 4) % 2 === 0 || n < url.length) { c.fillStyle = P.lime; c.fillRect(ux + cw + 4 * U, urlY - urlS * .5, urlS * .12, urlS * 1.05); }
  }
  // legal
  const la = prog(t, 1.2, 1.6) * .55;
  if (la > 0) {
    font(19 * U, 'Inter', 600); c.letterSpacing = 3 * U + 'px'; c.textAlign = 'center';
    c.fillStyle = WHITE(la); c.fillText('+18  ·  JOGA COM RESPONSABILIDADE', cx, H - 48 * U);
    c.letterSpacing = '0px';
  }
}

/* ---------- global overlays ---------- */
function wipes(t) {
  // diagonal shard: 3.78 → 4.32
  const p1 = eInCubic(prog(t, 3.76, 4.0)), p2 = eOutCubic(prog(t, 4.0, 4.34));
  if (p1 > 0 && p2 < 1) {
    c.save(); c.translate(cx, cy); c.rotate(-.5);
    const E = DIAG * .62;
    const layer = (lead, col) => {
      const b = lerp(-E, E, clamp(p1 + lead)), a = lerp(-E, E, clamp(p2 - lead * .5));
      if (b > a) { c.fillStyle = col; c.fillRect(a, -DIAG, b - a, DIAG * 2); }
    };
    layer(.12, P.violet); layer(0, P.lime);
    c.restore();
  }
  // vertical bars: 7.1 → 7.9
  const n = PORT ? 5 : 8, bw = W / n;
  for (let i = 0; i < n; i++) {
    const inP = eInOutCubic(prog(t, 7.08 + i * .03, 7.08 + i * .03 + .3));
    const outP = eInOutCubic(prog(t, 7.5 + i * .035, 7.5 + i * .035 + .32));
    if (inP <= 0 || outP >= 1) continue;
    c.fillStyle = i % 2 ? P.violet : P.lime;
    const y0 = H * (1 - inP), y1 = H * (1 - outP);
    c.fillRect(i * bw - 1, y0 * 0 + (outP > 0 ? 0 : y0), bw + 2, outP > 0 ? y1 : H - y0);
  }
}
function flashes(t) {
  let a = 0;
  for (const [ti, amp] of FLASH) { const d = t - ti; if (d >= 0 && d < .2) a = Math.max(a, amp * Math.pow(1 - d / .2, 2)); }
  if (a > 0) { c.fillStyle = `rgba(240,255,215,${a})`; full(); }
}
function hud(t) {
  if (t < 2 || t >= 12.5) return;
  const dark = t < 2.5;
  const col = dark ? 'rgba(11,11,15,.6)' : 'rgba(255,244,220,.5)';
  const m = 44 * U, L = 26 * U;
  c.strokeStyle = col; c.lineWidth = 2 * U;
  for (const [x, y, sx, sy] of [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]]) {
    c.beginPath(); c.moveTo(x, y + sy * L); c.lineTo(x, y); c.lineTo(x + sx * L, y); c.stroke();
  }
  font(17 * U, 'JBM', 700); c.fillStyle = col; c.letterSpacing = 2 * U + 'px';
  const f = Math.floor(t * FPS), tc = `00:${String(Math.floor(t)).padStart(2, '0')}:${String(f % FPS).padStart(2, '0')}`;
  c.textAlign = 'left'; c.fillText('CORVO BETS REWARDS', m + 36 * U, m + 22 * U);
  c.fillText(tc, m + 36 * U, H - m - 8 * U);
  c.textAlign = 'right'; c.fillText('CORVOBETSREWARDS.COM', W - m - 36 * U, m + 22 * U);
  c.fillText('PT · TOP 10 · MENSAL', W - m - 36 * U, H - m - 8 * U);
  c.letterSpacing = '0px';
}

function drawScene(t) {
  reset(c);
  const s = shake(t);
  c.save(); c.translate(cx + s.x, cy + s.y); c.rotate(s.r); c.translate(-cx, -cy);
  if (t < 2) S1(t); else if (t < 4) S2(t - 2); else if (t < 7.5) S3(t - 4);
  else if (t < 11) S4(t - 7.5); else if (t < 12.5) S5(t - 11); else S6(t - 12.5);
  c.restore(); reset(c);
  wipes(t); hud(t); flashes(t);
}

/* ---------- post: glitch, vignette, grain ---------- */
const GRAIN = Array.from({ length: 4 }, (_, k) => {
  const g = mk(256, 256), gx = g.getContext('2d'), id = gx.createImageData(256, 256), r = mulberry32(k + 1);
  for (let i = 0; i < id.data.length; i += 4) { const v = r() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  gx.putImageData(id, 0, 0); return g;
});
function post(t) {
  reset(out);
  let gl = 0;
  for (const [ti, d] of GLITCH) if (t >= ti && t < ti + d) gl = Math.max(gl, 1 - (t - ti) / d * .5);
  if (gl > 0) {
    tctx.clearRect(0, 0, W, H); tctx.drawImage(cv, 0, 0);
    const r = mulberry32(Math.floor(t * 90) + 3);
    for (let i = 0; i < 12; i++) {
      const y = r() * H, h = (8 + r() * 90) * U, dx = (r() - .5) * 220 * U * gl;
      out.drawImage(tmpC, 0, y, W, h, dx, y, W, h);
    }
    out.globalCompositeOperation = 'screen';
    for (let i = 0; i < 5; i++) {
      out.fillStyle = i % 2 ? `rgba(150,65,253,${.45 * gl})` : `rgba(200,240,0,${.35 * gl})`;
      out.fillRect(0, r() * H, W, (2 + r() * 10) * U);
    }
    out.globalCompositeOperation = 'source-over';
  }
  const v = out.createRadialGradient(cx, cy, Math.min(W, H) * .32, cx, cy, DIAG * .62);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.6)');
  out.fillStyle = v; out.fillRect(0, 0, W, H);
  const f = Math.floor(t * FPS);
  out.globalCompositeOperation = 'overlay'; out.globalAlpha = .09;
  out.fillStyle = out.createPattern(GRAIN[f % 4], 'repeat');
  out.save(); out.translate((f * 37) % 256, (f * 91) % 256); out.fillRect(-256, -256, W + 512, H + 512); out.restore();
  reset(out);
  const endFade = prog(t, 14.8, 15);
  if (endFade > 0) { out.fillStyle = `rgba(0,0,0,${endFade})`; out.fillRect(0, 0, W, H); }
}

function renderFrame(t) {
  reset(out);
  for (let i = 0; i < SUB; i++) {
    drawScene(t + (SUB > 1 ? (i / SUB) * (SHUTTER / FPS) : 0));
    out.globalAlpha = 1 / (i + 1); out.drawImage(sceneC, 0, 0);
  }
  out.globalAlpha = 1;
  post(t);
}
window.renderFrame = renderFrame;
window.META = { W, H, FPS, DUR };
window.ready = document.fonts.load('400 40px "Anton"')
  .then(() => Promise.all([document.fonts.load('800 40px "Inter"'), document.fonts.load('600 40px "Inter"'), document.fonts.load('700 40px "JBM"')]))
  .then(() => true);

/* ---------- live preview (browser) ---------- */
if (!RENDER) {
  const audio = new Audio('corvo-bets-rewards-audio.wav');
  let t0 = null;
  window.ready.then(() => {
    const loop = now => {
      if (t0 === null) t0 = now;
      const t = ((now - t0) / 1000) % DUR;
      renderFrame(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  });
  cv.addEventListener('click', () => { t0 = null; audio.currentTime = 0; audio.play().catch(() => {}); });
}
</script>
</body>
