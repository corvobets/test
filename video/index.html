<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corvo Bets Rewards — 15s</title>
<style>
  @font-face { font-family: 'Anton'; src: url(fonts/anton.woff2) format('woff2'); }
  @font-face { font-family: 'Inter'; src: url(fonts/inter.woff2) format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'JBM'; src: url(fonts/mono.woff2) format('woff2'); font-weight: 700; }
  html, body { margin: 0; background: #000; height: 100%; }
  body { display: grid; place-items: center; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; }
  body.render canvas { max-width: none; max-height: none; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
/* =====================================================================
   CORVO BETS REWARDS — 15s motion piece
   Deterministic timeline: renderFrame(t) draws the frame at time t (s).
   ?w=1920&h=1080  resolution (any aspect; layout adapts)
   ?render         headless render mode (no playback loop)
   ?sub=5          motion-blur subsamples per frame
   ===================================================================== */
const Q = new URLSearchParams(location.search);
const W = +Q.get('w') || 1920, H = +Q.get('h') || 1080;
const RENDER = Q.has('render');
const FPS = 30, DUR = 15, SUB = +(Q.get('sub') || 5), SHUTTER = 0.5;
if (RENDER) document.body.classList.add('render');

const cv = document.getElementById('cv');
cv.width = W; cv.height = H;
const out = cv.getContext('2d');
const mk = (w = W, h = H) => { const k = document.createElement('canvas'); k.width = w; k.height = h; return k; };
const sceneC = mk(), c = sceneC.getContext('2d');
const tmpC = mk(), tctx = tmpC.getContext('2d');
const offC = mk(), octx = offC.getContext('2d');

const U = Math.min(W, H) / 1080;      // layout unit
const PORT = H > W;
const cx = W / 2, cy = H / 2;
const DIAG = Math.hypot(W, H);

/* ---------- brand palette ---------- */
const P = {
  bg: '#060608', ink: '#0B0B0F', panel: '#111117',
  gold: '#F2B822', gold2: '#FFD66B', goldDeep: '#A06A08',
  cream: '#FFF4DC', white: '#FFFFFF', grey: '#2A2A33',
};
const GOLD = a => `rgba(242,184,34,${a})`;
const CREAM = a => `rgba(255,244,220,${a})`;

/* ---------- math ---------- */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, t) => a + (b - a) * t;
const eOutExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const eInExpo = x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10);
const eInOutExpo = x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2;
const eOutCubic = x => 1 - Math.pow(1 - x, 3);
const eInCubic = x => x * x * x;
const eInOutCubic = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eOutQuart = x => 1 - Math.pow(1 - x, 4);
const eOutBack = (x, s = 1.70158) => x <= 0 ? 0 : 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- drawing helpers ---------- */
function reset(ctx = c) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.shadowBlur = 0; ctx.shadowColor = 'transparent'; ctx.letterSpacing = '0px'; ctx.setLineDash([]);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'miter';
}
const full = (ctx = c) => ctx.fillRect(-W * .2, -H * .2, W * 1.4, H * 1.4);
function font(size, fam = 'Anton', w = 400, ctx = c) { ctx.font = `${w} ${size}px "${fam}"`; }
function fit(str, fam, w, maxW, maxS, ctx = c) { font(100, fam, w, ctx); return Math.min(maxS, 100 * maxW / ctx.measureText(str).width); }
// Anton caps sit ~0.36em above the middle baseline; use this to vertically centre caps
const CAP = .365;
function letters(str, spacing = 0, ctx = c) {
  const xs = [], ws = [];
  for (let i = 0; i < str.length; i++) { xs.push(ctx.measureText(str.slice(0, i)).width + i * spacing); ws.push(ctx.measureText(str[i]).width); }
  return { xs, ws, total: ctx.measureText(str).width + (str.length - 1) * spacing };
}
function rrect(x, y, w, h, r, ctx = c) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function goldGrad(y0, y1, ctx = c) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, P.gold2); g.addColorStop(.5, P.gold); g.addColorStop(1, P.goldDeep); return g;
}

function bgGlow(a, x = cx, y = cy, r = Math.max(W, H) * .75) {
  if (a <= 0) return;
  const g = c.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(110,74,8,${.55 * a})`); g.addColorStop(.45, `rgba(40,26,4,${.35 * a})`); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = g; full();
}
function rays(t, a, n = 18, x = cx, y = cy, speed = .12) {
  if (a <= 0) return;
  c.save(); c.translate(x, y); c.rotate(t * speed);
  const g = c.createRadialGradient(0, 0, 0, 0, 0, DIAG * .6);
  g.addColorStop(0, GOLD(a)); g.addColorStop(1, GOLD(0));
  c.fillStyle = g;
  for (let i = 0; i < n; i++) {
    const a0 = i / n * Math.PI * 2;
    c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, DIAG, a0, a0 + Math.PI / n * .5); c.closePath(); c.fill();
  }
  c.restore();
}
const rD = mulberry32(7);
const DUST = Array.from({ length: 120 }, () => ({ x: rD(), y: rD(), z: .25 + rD() * .75, ph: rD() * 6.28 }));
function dust(t, a) {
  if (a <= 0) return;
  c.save(); c.globalCompositeOperation = 'lighter';
  for (const d of DUST) {
    const x = ((d.x + t * .01 * d.z) % 1) * W;
    const y = (((d.y - t * .035 * d.z) % 1) + 1) % 1 * H;
    const tw = .45 + .55 * Math.sin(t * 2.6 + d.ph);
    c.fillStyle = `rgba(255,205,110,${a * tw * d.z * .9})`;
    c.beginPath(); c.arc(x, y, (1 + 2.6 * d.z) * U, 0, 7); c.fill();
  }
  c.restore();
}

/* ---------- raven emblem (geometric head, facing right) ---------- */
const RAVEN = new Path2D('M34 192 C28 160 30 130 42 108 L22 104 L44 94 L28 80 L54 80 C66 58 90 46 118 48 L152 56 L198 90 L186 95 L150 92 L140 100 L146 112 L130 110 L136 126 L118 120 L124 138 L106 130 L110 152 L96 146 L94 192 Z');
const R_BEAK = new Path2D('M152 56 L198 90 L186 95 L150 92 L140 80 Z');
const R_FACET1 = new Path2D('M150 92 L140 100 L146 112 L130 110 L136 126 L118 120 L124 138 L106 130 L110 152 L96 146 L94 192 L70 150 L118 96 Z');
const R_FACET2 = new Path2D('M54 80 C66 58 90 46 118 48 L100 74 Z');
const R_FACET3 = new Path2D('M42 108 L100 74 L118 96 L70 150 L34 192 C28 160 30 130 42 108 Z');
const EYE = [123, 70], RC = [112, 120];
function raven(x, y, size, o = {}) {
  c.save(); c.translate(x, y); const s = size / 200; c.scale(s, s); c.translate(-RC[0], -RC[1]);
  if (o.glow) { c.shadowColor = GOLD(.85); c.shadowBlur = o.glow; }
  c.fillStyle = goldGrad(40, 190); c.fill(RAVEN); c.shadowBlur = 0;
  c.fillStyle = 'rgba(255,240,190,.3)'; c.fill(R_FACET2);
  c.fillStyle = 'rgba(80,45,0,.2)'; c.fill(R_FACET3);
  c.fillStyle = 'rgba(60,30,0,.36)'; c.fill(R_FACET1);
  c.fillStyle = 'rgba(30,15,0,.42)'; c.fill(R_BEAK);
  c.strokeStyle = 'rgba(255,240,200,.6)'; c.lineWidth = 1.6; c.beginPath(); c.moveTo(156, 60); c.lineTo(194, 88); c.stroke();
  c.strokeStyle = 'rgba(30,15,0,.6)'; c.beginPath(); c.moveTo(150, 80); c.lineTo(190, 91); c.stroke();
  // angular eye
  c.fillStyle = P.bg; c.beginPath(); c.moveTo(EYE[0] - 10, EYE[1] + 1); c.lineTo(EYE[0] + 2, EYE[1] - 6); c.lineTo(EYE[0] + 10, EYE[1]); c.lineTo(EYE[0], EYE[1] + 5); c.closePath(); c.fill();
  c.fillStyle = o.eye || P.cream; c.beginPath(); c.arc(EYE[0] + 1.5, EYE[1] - .5, 2.6, 0, 7); c.fill();
  c.restore();
}
const eyePos = (x, y, size) => [x + (EYE[0] - RC[0]) * size / 200, y + (EYE[1] - RC[1]) * size / 200];
function badgeRing(x, y, r, t, a) {
  if (a <= 0) return;
  c.save(); c.translate(x, y); c.rotate(t * .7);
  c.strokeStyle = GOLD(a); c.lineWidth = 3 * U; c.lineCap = 'round';
  for (let i = 0; i < 3; i++) { c.beginPath(); c.arc(0, 0, r, i * 2.0944, i * 2.0944 + 1.55); c.stroke(); }
  c.rotate(-t * 1.5); c.lineWidth = 2 * U; c.setLineDash([1 * U, 12 * U]); c.strokeStyle = GOLD(a * .8);
  c.beginPath(); c.arc(0, 0, r * 1.13, 0, 7); c.stroke();
  c.restore(); c.lineCap = 'butt';
}
function flare(x, y, a) {
  if (a <= 0) return;
  c.save(); c.globalCompositeOperation = 'lighter';
  let g = c.createRadialGradient(x, y, 0, x, y, 140 * U);
  g.addColorStop(0, `rgba(255,240,200,${a})`); g.addColorStop(.25, `rgba(255,190,60,${a * .5})`); g.addColorStop(1, 'rgba(255,160,0,0)');
  c.fillStyle = g; c.beginPath(); c.arc(x, y, 140 * U, 0, 7); c.fill();
  c.translate(x, y); c.scale(1, .012);
  g = c.createRadialGradient(0, 0, 0, 0, 0, W * .55);
  g.addColorStop(0, `rgba(255,236,190,${a})`); g.addColorStop(1, 'rgba(255,180,40,0)');
  c.fillStyle = g; c.beginPath(); c.arc(0, 0, W * .55, 0, 7); c.fill();
  c.restore();
}
function coin(x, y, r, spin, a = 1) {
  const sx = Math.cos(spin);
  c.save(); c.globalAlpha *= a; c.translate(x, y); c.scale(Math.max(.06, Math.abs(sx)), 1);
  c.fillStyle = sx > 0 ? goldGrad(-r, r) : P.goldDeep; c.beginPath(); c.arc(0, 0, r, 0, 7); c.fill();
  c.strokeStyle = 'rgba(255,245,200,.7)'; c.lineWidth = r * .1; c.beginPath(); c.arc(0, 0, r * .72, 0, 7); c.stroke();
  if (sx > 0) { font(r * 1.05); c.textAlign = 'center'; c.fillStyle = 'rgba(90,55,0,.8)'; c.fillText('€', 0, r * CAP); }
  c.restore();
}
function crown(x, y, s, a = 1) {
  c.save(); c.globalAlpha *= a; c.translate(x, y); c.scale(s / 100, s / 100);
  c.shadowColor = GOLD(.9); c.shadowBlur = 25;
  c.fillStyle = goldGrad(-40, 40);
  c.beginPath(); c.moveTo(-50, 30); c.lineTo(-56, -26); c.lineTo(-26, 2); c.lineTo(0, -40); c.lineTo(26, 2); c.lineTo(56, -26); c.lineTo(50, 30); c.closePath(); c.fill();
  c.shadowBlur = 0; c.fillStyle = P.cream;
  for (const [px, py] of [[-56, -26], [0, -40], [56, -26]]) { c.beginPath(); c.arc(px, py, 7, 0, 7); c.fill(); }
  c.fillStyle = 'rgba(90,50,0,.35)'; c.fillRect(-50, 18, 100, 12);
  c.restore();
}

/* ---------- global timing: impacts, flashes, glitches ---------- */
const HITS = [[0.95, 12], [2.0, 22], [2.5, 12], [3.0, 12], [3.5, 12], [5.4, 26], [7.5, 10], [10.3, 22], [11.0, 14], [12.5, 30]];
const FLASH = [[0.95, .45], [2.0, .85], [2.5, .3], [3.0, .3], [3.5, .3], [5.4, .55], [10.3, .45], [12.5, .95]];
const GLITCH = [[3.94, .1], [10.84, .2], [7.44, .08]];
function shake(t) {
  let x = 0, y = 0, r = 0;
  for (const [ti, a] of HITS) {
    const d = t - ti; if (d < 0 || d > .7) continue;
    const e = a * U * Math.exp(-d * 8);
    x += e * Math.sin(d * 83 + ti * 3); y += e * Math.cos(d * 71 + ti * 5); r += e * .0007 * Math.sin(d * 57 + ti);
  }
  return { x, y, r };
}

/* =====================================================================
   SCENES
   ===================================================================== */

/* 0.0 – 2.0  |  logo ignition */
function S1(t) {
  c.fillStyle = P.bg; full();
  bgGlow(eOutCubic(prog(t, .6, 1.4)));
  rays(t, .05 * eOutCubic(prog(t, .9, 1.6)), 20);
  dust(t, prog(t, .5, 1.3));

  const emS1 = (PORT ? 300 : 230) * U;
  const titleSize = fit('CORVO BETS', 'Anton', 400, W * .84, (PORT ? 200 : 190) * U);
  const rewSize = titleSize * .4;
  const gap = 34 * U;
  const stackH = emS1 + gap + titleSize * .73 + gap * .9 + rewSize * .73;
  const top = cy - stackH / 2;
  const emY1 = top + emS1 / 2;
  const titleY = top + emS1 + gap + titleSize * .73 / 2;
  const rewY = titleY + titleSize * .73 / 2 + gap * .9 + rewSize * .73 / 2;

  // exit: zoom through the title
  const zp = eInExpo(prog(t, 1.72, 2.0));
  c.save();
  c.translate(cx, titleY); c.scale(1 + zp * 9, 1 + zp * 9); c.translate(-cx, -titleY);

  // emblem reveal & move
  const er = eOutExpo(prog(t, .3, 1.0));
  const mv = eInOutCubic(prog(t, .95, 1.45));
  const emY = lerp(cy, emY1, mv);
  const emS = lerp(emS1 * 1.55, emS1, mv) * lerp(1.12, 1, er);
  if (er > 0) {
    c.save();
    const hh = emS * .62 * er;
    c.beginPath(); c.rect(0, emY - hh, W, hh * 2); c.clip();
    raven(cx, emY, emS, { glow: 40 * er });
    c.restore();
    badgeRing(cx, emY + emS * .02, emS * .66, t, eOutCubic(prog(t, 1.0, 1.5)) * .9);
  }
  // ignition line
  const lp = eOutExpo(prog(t, .04, .6)), la = 1 - prog(t, .7, .95);
  if (lp > 0 && la > 0) {
    const hh = emS * .62 * er;
    c.save(); c.shadowColor = P.gold; c.shadowBlur = 30 * U; c.fillStyle = CREAM(la);
    const lw = W * .92 * lp;
    c.fillRect(cx - lw / 2, emY - hh - 1.5 * U, lw, 3 * U);
    c.fillRect(cx - lw / 2, emY + hh - 1.5 * U, lw, 3 * U);
    c.restore();
  }
  // eye flare
  const ef = Math.max(0, 1 - Math.abs(t - .98) / .28);
  flare(...eyePos(cx, emY, emS), eOutCubic(ef));

  // CORVO BETS — letter slam
  font(titleSize); c.textAlign = 'center';
  const L = letters('CORVO BETS', titleSize * .02);
  for (let i = 0; i < 10; i++) {
    const st = 1.02 + i * .035, p = eOutExpo(prog(t, st, st + .5));
    if (p <= 0) continue;
    const x = cx - L.total / 2 + L.xs[i] + L.ws[i] / 2, s = lerp(2.8, 1, p);
    c.save(); c.translate(x, titleY); c.scale(s, s); c.globalAlpha = clamp(p * 1.5);
    c.fillStyle = P.cream; c.fillText('CORVO BETS'[i], 0, titleSize * CAP);
    c.restore();
  }
  // REWARDS — tracking-in outline, then gold fill wipe
  const rp = eOutExpo(prog(t, 1.25, 1.9));
  if (rp > 0) {
    font(rewSize); const sp = lerp(.9, .42, rp) * rewSize;
    c.letterSpacing = sp + 'px'; c.textAlign = 'center';
    const rx = cx + sp / 2, ry = rewY + rewSize * CAP;
    c.globalAlpha = clamp(rp * 1.4);
    c.strokeStyle = P.gold; c.lineWidth = 2 * U; c.strokeText('REWARDS', rx, ry);
    const fw = eInOutCubic(prog(t, 1.45, 1.8));
    if (fw > 0) {
      const tw = c.measureText('REWARDS').width;
      c.save(); c.beginPath(); c.rect(rx - tw / 2 - sp, ry - rewSize, (tw + sp) * fw, rewSize * 1.4); c.clip();
      c.fillStyle = goldGrad(ry - rewSize * .75, ry); c.fillText('REWARDS', rx, ry); c.restore();
    }
    c.globalAlpha = 1; c.letterSpacing = '0px';
  }
  c.restore();
}

/* 2.0 – 4.0  |  kinetic words on the beat */
function echoRows(str, col, t, size, speed, rot = -.14, stroke = true) {
  c.save(); c.translate(cx, cy); c.rotate(rot);
  font(size); c.textAlign = 'left';
  const unit = c.measureText(str + '  ').width, rowH = size * .95;
  const n = Math.ceil(DIAG / rowH / 2) + 1;
  c.strokeStyle = col; c.fillStyle = col; c.lineWidth = 2 * U;
  for (let r = -n; r <= n; r++) {
    const dir = (r & 1) ? 1 : -1;
    const off = (((t * speed * dir) % unit) + unit) % unit;
    for (let x = -DIAG / 2 - unit + off; x < DIAG / 2; x += unit)
      stroke ? c.strokeText(str, x, r * rowH + size * CAP) : c.fillText(str, x, r * rowH + size * CAP);
  }
  c.restore();
}
function chevron(x, y, s, col, lw) {
  c.strokeStyle = col; c.lineWidth = lw; c.beginPath();
  c.moveTo(x - s, y + s * .55); c.lineTo(x, y - s * .45); c.lineTo(x + s, y + s * .55); c.stroke();
}
function S2(t) {
  const k = Math.min(3, Math.floor(t / .5)), tb = t - k * .5;
  const maxS = (PORT ? 330 : 440) * U;
  if (k === 0) {                         // APOSTA.
    c.fillStyle = P.gold; full();
    echoRows('APOSTA', 'rgba(11,11,15,.13)', t, 170 * U, 260 * U);
    const size = fit('APOSTA.', 'Anton', 400, W * .88, maxS);
    const p = eOutExpo(prog(tb, 0, .32)), s = lerp(1.7, 1, p) * (1 + tb * .07);
    c.save(); c.translate(cx, cy); c.scale(s, s); c.transform(1, 0, lerp(-.35, 0, p), 1, 0, 0);
    font(size); c.textAlign = 'center'; c.fillStyle = P.ink; c.fillText('APOSTA.', 0, size * CAP);
    c.restore();
    const bw = W * .5 * eOutExpo(prog(tb, .08, .4));
    c.fillStyle = P.ink; c.fillRect(cx - bw / 2, cy + size * .5, bw, 10 * U);
  } else if (k === 1) {                  // SOBE.
    c.fillStyle = P.ink; full();
    for (let i = 0; i < 9; i++) {
      const x = W * (i + .5) / 9, ph = ((tb * 1.9 + i * .37) % 1);
      chevron(x, H * 1.15 - ph * H * 1.4, 70 * U, GOLD(.12 + .1 * (i % 3)), 10 * U);
    }
    const size = fit('SOBE.', 'Anton', 400, W * .7, maxS * 1.1);
    const p = eOutExpo(prog(tb, 0, .3));
    c.save(); c.beginPath(); c.rect(0, cy - size * .52, W, size * 1.04); c.clip();
    font(size); c.textAlign = 'center';
    c.fillStyle = goldGrad(cy - size * .4, cy + size * .4);
    c.fillText('SOBE.', cx, cy + size * CAP + (1 - p) * size * 1.1 - tb * 60 * U);
    c.restore();
  } else if (k === 2) {                  // GANHA.
    c.fillStyle = P.cream; full();
    echoRows('GANHA', 'rgba(160,106,8,.16)', t, 170 * U, 300 * U, .14);
    const size = fit('GANHA.', 'Anton', 400, W * .82, maxS);
    font(size); c.textAlign = 'center';
    const L = letters('GANHA.', 0);
    c.save(); c.beginPath(); c.rect(0, cy - size * .5, W, size); c.clip();
    for (let i = 0; i < 6; i++) {
      const p = eOutExpo(prog(tb, i * .03, i * .03 + .3));
      const x = cx - L.total / 2 + L.xs[i] + L.ws[i] / 2;
      c.fillStyle = P.ink; c.fillText('GANHA.'[i], x, cy + size * CAP + (1 - p) * size * (i % 2 ? -1 : 1));
    }
    c.restore();
    const uw = L.total * eOutExpo(prog(tb, .12, .42));
    c.fillStyle = P.gold; c.fillRect(cx - L.total / 2, cy + size * .47, uw, 16 * U);
  } else {                               // REPETE. — echo stack
    c.fillStyle = P.ink; full();
    const size = fit('REPETE.', 'Anton', 400, W * (PORT ? .8 : .6), (PORT ? 250 : 230) * U);
    font(size); c.textAlign = 'center';
    const lh = size * .8, drift = -tb * 120 * U;
    for (let j = -5; j <= 5; j++) {
      const d = Math.abs(j), p = eOutExpo(prog(tb, d * .035, d * .035 + .25));
      if (p <= 0) continue;
      const y = cy + j * lh * lerp(.4, 1, p) + drift + size * CAP;
      c.globalAlpha = j === 0 ? 1 : p * Math.max(.15, 1 - d * .16);
      if (j === 0) { c.fillStyle = goldGrad(y - size * .72, y); c.fillText('REPETE.', cx, y); }
      else { c.strokeStyle = CREAM(1); c.lineWidth = 2 * U; c.strokeText('REPETE.', cx, y); }
    }
    c.globalAlpha = 1;
  }
}

/* 4.0 – 7.5  |  1.000€ em prémios */
const rC = mulberry32(21);
const BURST = Array.from({ length: 44 }, () => { const a = rC() * Math.PI * 2, v = (600 + rC() * 1400); return { vx: Math.cos(a) * v, vy: Math.sin(a) * v - 500, r: 16 + rC() * 26, spin: rC() * 6, sv: 6 + rC() * 14 }; });

/* 7.5 – 11.0  |  TOP 10 leaderboard: TU sobes de 10.º a 1.º */

/* ---------- global overlays ---------- */

  const p1 = eInCubic(prog(t, 3.76, 4.0)), p2 = eOutCubic(prog(t, 4.0, 4.34));
  if (p1 > 0 && p2 < 1) {
    c.save(); c.translate(cx, cy); c.rotate(-.5);
    const E = DIAG * .62;
    const layer = (lead, col) => {
      const b = lerp(-E, E, clamp(p1 + lead)), a = lerp(-E, E, clamp(p2 - lead * .5));
      if (b > a) { c.fillStyle = col; c.fillRect(a, -DIAG, b - a, DIAG * 2); }
    };
    layer(.12, P.cream); layer(0, P.gold);
    c.restore();
  }
  // vertical bars: 7.1 → 7.9
  const n = PORT ? 5 : 8, bw = W / n;
  for (let i = 0; i < n; i++) {
    const inP = eInOutCubic(prog(t, 7.08 + i * .03, 7.08 + i * .03 + .3));
    const outP = eInOutCubic(prog(t, 7.5 + i * .035, 7.5 + i * .035 + .32));
    if (inP <= 0 || outP >= 1) continue;
    c.fillStyle = i % 2 ? P.goldDeep : P.gold;
    const y0 = H * (1 - inP), y1 = H * (1 - outP);
    c.fillRect(i * bw - 1, y0 * 0 + (outP > 0 ? 0 : y0), bw + 2, outP > 0 ? y1 : H - y0);
  }
}
function flashes(t) {
  let a = 0;
  for (const [ti, amp] of FLASH) { const d = t - ti; if (d >= 0 && d < .2) a = Math.max(a, amp * Math.pow(1 - d / .2, 2)); }
  if (a > 0) { c.fillStyle = `rgba(255,248,232,${a})`; full(); }
}
function hud(t) {
  if (t < 2 || t >= 12.5) return;
  const dark = (t < 2.5) || (t >= 3.0 && t < 3.5);
  const col = dark ? 'rgba(11,11,15,.6)' : 'rgba(255,244,220,.5)';
  const m = 44 * U, L = 26 * U;
  c.strokeStyle = col; c.lineWidth = 2 * U;
  for (const [x, y, sx, sy] of [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]]) {
    c.beginPath(); c.moveTo(x, y + sy * L); c.lineTo(x, y); c.lineTo(x + sx * L, y); c.stroke();
  }
  font(17 * U, 'JBM', 700); c.fillStyle = col; c.letterSpacing = 2 * U + 'px';
  const f = Math.floor(t * FPS), tc = `00:${String(Math.floor(t)).padStart(2, '0')}:${String(f % FPS).padStart(2, '0')}`;
  c.textAlign = 'left'; c.fillText('CORVO BETS REWARDS', m + 36 * U, m + 22 * U);
  c.fillText(tc, m + 36 * U, H - m - 8 * U);
  c.textAlign = 'right'; c.fillText('CORVOBETSREWARDS.COM', W - m - 36 * U, m + 22 * U);
  c.fillText('PT · TOP 10 · MENSAL', W - m - 36 * U, H - m - 8 * U);
  c.letterSpacing = '0px';
}

function drawScene(t) {
  reset(c);
  const s = shake(t);
  c.save(); c.translate(cx + s.x, cy + s.y); c.rotate(s.r); c.translate(-cx, -cy);
  if (t < 2) S1(t); else if (t < 4) S2(t - 2); else if (t < 7.5) S3(t - 4);
  else if (t < 11) S4(t - 7.5); else if (t < 12.5) S5(t - 11); else S6(t - 12.5);
  c.restore(); reset(c);
  wipes(t); hud(t); flashes(t);
}

/* ---------- post: glitch, vignette, grain ---------- */
const GRAIN = Array.from({ length: 4 }, (_, k) => {
  const g = mk(256, 256), gx = g.getContext('2d'), id = gx.createImageData(256, 256), r = mulberry32(k + 1);
  for (let i = 0; i < id.data.length; i += 4) { const v = r() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  gx.putImageData(id, 0, 0); return g;
});
function post(t) {
  reset(out);
  let gl = 0;
  for (const [ti, d] of GLITCH) if (t >= ti && t < ti + d) gl = Math.max(gl, 1 - (t - ti) / d * .5);
  if (gl > 0) {
    tctx.clearRect(0, 0, W, H); tctx.drawImage(cv, 0, 0);
    const r = mulberry32(Math.floor(t * 90) + 3);
    for (let i = 0; i < 12; i++) {
      const y = r() * H, h = (8 + r() * 90) * U, dx = (r() - .5) * 220 * U * gl;
      out.drawImage(tmpC, 0, y, W, h, dx, y, W, h);
    }
    out.globalCompositeOperation = 'screen';
    for (let i = 0; i < 5; i++) {
      out.fillStyle = i % 2 ? `rgba(255,40,120,${.35 * gl})` : `rgba(40,230,255,${.35 * gl})`;
      out.fillRect(0, r() * H, W, (2 + r() * 10) * U);
    }
    out.globalCompositeOperation = 'source-over';
  }
  const v = out.createRadialGradient(cx, cy, Math.min(W, H) * .32, cx, cy, DIAG * .62);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.6)');
  out.fillStyle = v; out.fillRect(0, 0, W, H);
  const f = Math.floor(t * FPS);
  out.globalCompositeOperation = 'overlay'; out.globalAlpha = .09;
  out.fillStyle = out.createPattern(GRAIN[f % 4], 'repeat');
  out.save(); out.translate((f * 37) % 256, (f * 91) % 256); out.fillRect(-256, -256, W + 512, H + 512); out.restore();
  reset(out);
  const endFade = prog(t, 14.8, 15);
  if (endFade > 0) { out.fillStyle = `rgba(0,0,0,${endFade})`; out.fillRect(0, 0, W, H); }
}

function renderFrame(t) {
  reset(out);
  for (let i = 0; i < SUB; i++) {
    drawScene(t + (SUB > 1 ? (i / SUB) * (SHUTTER / FPS) : 0));
    out.globalAlpha = 1 / (i + 1); out.drawImage(sceneC, 0, 0);
  }
  out.globalAlpha = 1;
  post(t);
}
window.renderFrame = renderFrame;
window.META = { W, H, FPS, DUR };
window.ready = document.fonts.load('400 40px "Anton"')
  .then(() => Promise.all([document.fonts.load('800 40px "Inter"'), document.fonts.load('600 40px "Inter"'), document.fonts.load('700 40px "JBM"')]))
  .then(() => true);

/* ---------- live preview (browser) ---------- */
if (!RENDER) {
  const audio = new Audio('corvo-bets-rewards-audio.wav');
  let t0 = null;
  window.ready.then(() => {
    const loop = now => {
      if (t0 === null) t0 = now;
      const t = ((now - t0) / 1000) % DUR;
      renderFrame(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  });
  cv.addEventListener('click', () => { t0 = null; audio.currentTime = 0; audio.play().catch(() => {}); });
}
</script>
</body>
