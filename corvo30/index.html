<!doctype html>

<body>
<canvas id="cv"></canvas>
<script src="timeline.js"></script>

<script>
/* =====================================================================
   CORVO BETS — 30s promo · 1920×1080 · 60 fps
   renderFrame(t) (async) draws the frame at time t (s). Deterministic.
   ?render  headless mode   ?sub=3  motion-blur subsamples
   ===================================================================== */
const Q = new URLSearchParams(location.search);
const W = 1920, H = 1080, FPS = 60, DUR = TL.DUR;
const SUB = +(Q.get('sub') || 3), SHUTTER = 0.5;
const RENDER = Q.has('render');
if (RENDER) document.body.classList.add('render');
const { EV, BEAT } = TL, bt = TL.b;

const cv = document.getElementById('cv'); cv.width = W; cv.height = H;
const out = cv.getContext('2d');
const mk = (w = W, h = H) => { const k = document.createElement('canvas'); k.width = w; k.height = h; return k; };
const sceneC = mk();
let c = sceneC.getContext('2d');

const P = {
  lime: '#C8F000', logoLime: '#C7FD42', purple: '#0E0934', surface: '#17133C', dark: '#090A10',
  violet: '#9641FD', white: '#FFFFFF', cta: '#0A0A0F', tg: '#2AABEE', tgBtn: '#4A90E2', tgBg: '#1E1E1E',
};
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };

/* ---------- math ---------- */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, t) => a + (b - a) * t;
const eOutExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const eInExpo = x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10);
const eInOutExpo = x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2;
const eOutCubic = x => 1 - Math.pow(1 - x, 3);
const eInCubic = x => x * x * x;

const eInOutSine = x => -(Math.cos(Math.PI * x) - 1) / 2;
const eOutQuart = x => 1 - Math.pow(1 - x, 4);
const eOutBack = (x, s = 1.7) => x <= 0 ? 0 : 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
const pulse = (t, a, b, f = .2) => Math.min(eOutCubic(prog(t, a, a + f)), 1 - eInCubic(prog(t, b - f, b)));

function kf(t, keys, ease = eInOutCubic) {

}
// monotone cubic time remap (speed ramps): keys [[tOut, tSrc], ...]
function remap(keys) {
  const n = keys.length, xs = keys.map(k => k[0]), ys = keys.map(k => k[1]);
  const d = [], m = new Array(n).fill(0);
  for (let i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] > 0 ? (d[i - 1] + d[i]) / 2 : 0;
  // Fritsch–Carlson limiter keeps the remap monotone (no backwards playback)
  for (let i = 0; i < n - 1; i++) { if (d[i] === 0) { m[i] = m[i + 1] = 0; continue; } const a = m[i] / d[i], b = m[i + 1] / d[i], h2 = a * a + b * b; if (h2 > 9) { const k = 3 / Math.sqrt(h2); m[i] = k * a * d[i]; m[i + 1] = k * b * d[i]; } }
  return t => {
    if (t <= xs[0]) return ys[0] + (t - xs[0]) * m[0];
    if (t >= xs[n - 1]) return ys[n - 1] + (t - xs[n - 1]) * m[n - 1];
    let i = 0; while (t > xs[i + 1]) i++;
    const h = xs[i + 1] - xs[i], s = (t - xs[i]) / h, s2 = s * s, s3 = s2 * s;
    return (2 * s3 - 3 * s2 + 1) * ys[i] + (s3 - 2 * s2 + s) * h * m[i] + (-2 * s3 + 3 * s2) * ys[i + 1] + (s3 - s2) * h * m[i + 1];

}

/* ---------- drawing helpers ---------- */
function reset(ctx = c) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
}
function M(size, w = 900, it = false, ctx = c) { ctx.font = `${it ? 'italic ' : ''}${w} ${size}px Montserrat`; }
function RB(size, w = 400, ctx = c) { ctx.font = `${w} ${size}px Roboto, Montserrat, sans-serif`; }
function tw(s, size, w = 900, it = false, ls = 0) { M(size, w, it); c.letterSpacing = ls + 'px'; const m = c.measureText(s).width; c.letterSpacing = '0px'; return m; }
function txt(s, x, y, size, o = {}) {
  const { w = 900, it = false, col = P.white, align = 'left', ls = 0, a = 1, ctx = c, font = 'M' } = o;
  if (a <= 0) return;
  if (font === 'M') M(size, w, it, ctx); else RB(size, w, ctx);
  ctx.letterSpacing = ls + 'px'; ctx.textAlign = align; ctx.fillStyle = col;
  const ga = ctx.globalAlpha; ctx.globalAlpha = ga * a;
  ctx.fillText(s, align === 'center' ? x + ls / 2 : x, y);
  ctx.globalAlpha = ga; ctx.letterSpacing = '0px'; ctx.textAlign = 'left';
}
function rr(x, y, w, h, r, ctx = c) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
const SLANT = Math.tan(11.6 * Math.PI / 180);   // the BETS-tag angle
function slantRect(x, y, w, h, ctx = c) { const d = h * SLANT; ctx.beginPath(); ctx.moveTo(x + d, y); ctx.lineTo(x + w + d, y); ctx.lineTo(x + w, y + h); ctx.lineTo(x, y + h); ctx.closePath(); }
// word-by-word rise from a clipped baseline box (kinetic type)

  M(size, w, it); c.letterSpacing = ls + 'px';
  const sp = c.measureText(' ').width, ws = words.map(s => c.measureText(s).width);
  const total = ws.reduce((p, v) => p + v, 0) + sp * (words.length - 1);
  let x0 = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  c.save(); c.globalAlpha *= a;
  c.beginPath(); c.rect(x0 - 60, y - size * 1.05, total + 120, size * 1.38); c.clip();
  words.forEach((s, i) => {
    const pin = eOutExpo(prog(t, tIn + i * stagger, tIn + i * stagger + dur));
    const pout = tOut == null ? 0 : eInCubic(prog(t, tOut + i * stagger * .5, tOut + i * stagger * .5 + .3));

      const dy = (1 - pin) * size * 1.15 - pout * size * 1.2;

      if (glow) { c.shadowColor = rgba(P.lime, 0.55 * glow); c.shadowBlur = size * 0.25; }

}
// oversized slam: scale-down with overshoot
function slam(s, x, y, size, t, t0, o = {}) {
  const { w = 900, it = false, col = P.white, s0 = 1.9, dur = .45, a = 1, tOut = null, ls = -size * 0.015, align = 'center', stroke = 0 } = o;
  const p = prog(t, t0, t0 + dur); if (p <= 0) return 0;
  const po = tOut == null ? 0 : eInCubic(prog(t, tOut, tOut + .28));
  if (po >= 1) return 0;
  const sc = lerp(s0, 1, eOutExpo(p)) * (1 + po * 0.35);
  M(size, w, it); c.letterSpacing = ls + 'px';
  const wd = c.measureText(s).width;
  c.save(); c.translate(x, y); c.scale(sc, sc); c.globalAlpha *= a * clamp(p * 4) * (1 - po);
  c.textAlign = align;
  if (stroke) { c.strokeStyle = col; c.lineWidth = stroke; c.strokeText(s, 0, 0); } else { c.fillStyle = col; c.fillText(s, 0, 0); }
  c.restore(); c.letterSpacing = '0px';
  return wd;
}

/* ---------- assets ---------- */
const CLIPS = {};             // meta per clip
const IMG = {};               // static images
async function loadJSON(u) { return (await fetch(u)).json(); }
function loadImage(src) { return new Promise((res, rej) => { const im = new Image(); im.onload = () => im.decode().then(() => res(im), () => res(im)); im.onerror = rej; im.src = src; }); }
const FS = {                  // frame store with LRU + miss tracking
  cache: new Map(), misses: new Set(), limit: 60,
  get(clip, kind, i) {
    const m = CLIPS[clip]; if (!m) return null;
    i = clamp(Math.round(i), 0, m.count - 1);
    const key = `assets/${clip}/${kind}_${String(i).padStart(4, '0')}.${kind === 'plate' ? 'jpg' : 'webp'}`;
    const hit = this.cache.get(key);
    if (hit) { this.cache.delete(key); this.cache.set(key, hit); return hit; }
    this.misses.add(key); return null;
  },
  async fill() {
    const keys = [...this.misses]; this.misses.clear();
    await Promise.all(keys.map(async k => { const im = await loadImage(k); this.cache.set(k, im); }));
    while (this.cache.size > this.limit) this.cache.delete(this.cache.keys().next().value);
  },
};
// frame index at source time (seconds, absolute in the original clip)
const frameAt = (clip, srcT) => { const m = CLIPS[clip]; return (srcT - m.start) * m.fps; };
function drawFrame(clip, kind, srcT, x, y, w, h, a = 1, blend = false) {
  const f = frameAt(clip, srcT), i0 = Math.floor(f), fr = f - i0;
  const im = FS.get(clip, kind, i0); if (!im) return false;
  c.save(); c.globalAlpha *= a; c.drawImage(im, x, y, w, h);
  if (blend && fr > 0.05) { const im2 = FS.get(clip, kind, i0 + 1); if (im2) { c.globalAlpha = a * fr; c.drawImage(im2, x, y, w, h); } }
  c.restore(); return true;
}
// soft glow from an alpha image (downsampled blur), tinted
const GLOW_C = mk(240, 240), gctx = GLOW_C.getContext('2d');
function glowOf(img, x, y, w, h, col, a, down = 14, spread = 1.12) {
  if (!img || a <= 0) return;
  const gw = Math.max(8, Math.round(w / down)), gh = Math.max(8, Math.round(h / down));
  if (GLOW_C.width !== gw || GLOW_C.height !== gh) { GLOW_C.width = gw; GLOW_C.height = gh; }
  gctx.globalCompositeOperation = 'source-over'; gctx.clearRect(0, 0, gw, gh);
  gctx.drawImage(img, 1, 1, gw - 2, gh - 2);
  gctx.globalCompositeOperation = 'source-in'; gctx.fillStyle = col; gctx.fillRect(0, 0, gw, gh);
  c.save(); c.globalCompositeOperation = 'lighter'; c.globalAlpha *= a; c.imageSmoothingQuality = 'high';
  const ex = w * (spread - 1) / 2, ey = h * (spread - 1) / 2;
  c.drawImage(GLOW_C, x - ex, y - ey, w + ex * 2, h + ey * 2);
  c.restore();
}

// rim light: tinted, slightly soft silhouette drawn offset behind the subject
const RIM_C = mk(64, 64), rctx = RIM_C.getContext('2d');
function rimLight(img, x, y, w, h, col, a, dx, dy, down = 3) {
  if (!img || a <= 0) return;
  const gw = Math.max(8, Math.round(w / down)), gh = Math.max(8, Math.round(h / down));
  if (RIM_C.width !== gw || RIM_C.height !== gh) { RIM_C.width = gw; RIM_C.height = gh; }
  rctx.globalCompositeOperation = 'source-over'; rctx.clearRect(0, 0, gw, gh); rctx.drawImage(img, 0, 0, gw, gh);
  rctx.globalCompositeOperation = 'source-in'; rctx.fillStyle = col; rctx.fillRect(0, 0, gw, gh);
  c.save(); c.globalCompositeOperation = 'lighter'; c.globalAlpha *= a; c.drawImage(RIM_C, x + dx, y + dy, w, h); c.restore();
}
/* ---------- stage: deep purple + banner-style light columns ---------- */
const COL_SPRITE = (() => {
  const s = mk(64, 540), x = s.getContext('2d');
  for (let i = 0; i < 64; i++) {
    const d = (i - 31.5) / 32, a = Math.exp(-d * d * 5);
    const g = x.createLinearGradient(0, 0, 0, 540);
    g.addColorStop(0, `rgba(150,65,253,${a})`); g.addColorStop(.45, `rgba(120,50,240,${a * .35})`); g.addColorStop(.8, `rgba(140,60,250,${a * .55})`); g.addColorStop(1, `rgba(160,80,255,${a * .9})`);
    x.fillStyle = g; x.fillRect(i, 0, 1, 540);
  }
  return s;
})();
const rS = mulberry32(5);
const COLS = Array.from({ length: 16 }, (_, k) => {
  const side = k % 2 ? 1 : 0, x = side ? 1920 - Math.pow(rS(), 1.6) * 760 : Math.pow(rS(), 1.6) * 760;
  return { x, w: 60 + rS() * 230, a: 0.18 + rS() * 0.5, v: (rS() - .5) * 26, ph: rS() * 6 };
});
function stage(t, o = {}) {
  const { base = P.purple, light = 1, center = 0.25, tt = Math.min(t, 26) } = o;
  c.fillStyle = base; c.fillRect(-200, -200, W + 400, H + 400);
  if (light > 0) {
    c.save(); c.globalCompositeOperation = 'lighter';
    for (const k of COLS) {
      const x = k.x + k.v * tt, fl = 0.85 + 0.15 * Math.sin(tt * 1.3 + k.ph);
      c.globalAlpha = k.a * light * fl * 0.55; c.drawImage(COL_SPRITE, x - k.w / 2, -20, k.w, H + 40);
    }
    if (center > 0) {
      const g = c.createRadialGradient(W / 2, H * 0.62, 0, W / 2, H * 0.62, 900);
      g.addColorStop(0, `rgba(90,40,200,${0.35 * center * light})`); g.addColorStop(1, 'rgba(90,40,200,0)');
      c.globalAlpha = 1; c.fillStyle = g; c.fillRect(0, 0, W, H);
    }
    c.restore();
  }
}

/* ---------- 3D football (truncated icosahedron, curved panels) ---------- */
const BALL = (() => {
  const p = (1 + Math.sqrt(5)) / 2;
  const V = [[-1, p, 0], [1, p, 0], [-1, -p, 0], [1, -p, 0], [0, -1, p], [0, 1, p], [0, -1, -p], [0, 1, -p], [p, 0, -1], [p, 0, 1], [-p, 0, -1], [-p, 0, 1]].map(v => { const l = Math.hypot(...v); return v.map(x => x / l); });

  const lerp3 = (a, b, t) => a.map((x, i) => x + (b[i] - x) * t);
  const norm = v => { const l = Math.hypot(...v); return v.map(x => x / l); };
  const faces = [];
  // hexagons (one per icosa face)
  for (const [a, b, cc] of F) {
    const A = V[a], B = V[b], C = V[cc];
    faces.push({ hex: true, pts: [lerp3(A, B, 1 / 3), lerp3(A, B, 2 / 3), lerp3(B, C, 1 / 3), lerp3(B, C, 2 / 3), lerp3(C, A, 1 / 3), lerp3(C, A, 2 / 3)].map(norm) });
  }
  // pentagons (one per icosa vertex)
  V.forEach((v, vi) => {
    const nb = []; F.forEach(f => { if (f.includes(vi)) f.forEach(j => { if (j !== vi && !nb.includes(j)) nb.push(j); }); });
    const pts = nb.map(j => norm(lerp3(v, V[j], 1 / 3)));
    // order around v
    const ref = norm(pts[0].map((x, i) => x - v[i]));
    const bx = ref, by = norm([v[1] * bx[2] - v[2] * bx[1], v[2] * bx[0] - v[0] * bx[2], v[0] * bx[1] - v[1] * bx[0]]);
    pts.sort((P1, P2) => Math.atan2(P1.reduce((s, x, i) => s + (x - v[i]) * by[i], 0), P1.reduce((s, x, i) => s + (x - v[i]) * bx[i], 0)) - Math.atan2(P2.reduce((s, x, i) => s + (x - v[i]) * by[i], 0), P2.reduce((s, x, i) => s + (x - v[i]) * bx[i], 0)));

  for (const f of faces) {
    const out = [];
    for (let i = 0; i < f.pts.length; i++) { const a = f.pts[i], b = f.pts[(i + 1) % f.pts.length]; for (let k = 0; k < 5; k++) out.push(norm(lerp3(a, b, k / 5))); }

})();
function rot3(v, ax, ay, az) {

function drawBall(cx, cy, r, ax, ay, az, o = {}) {
  const { a = 1, glow = 0.6, flat = 0 } = o;
  if (a <= 0 || r < 1) return;
  c.save(); c.globalAlpha *= a;
  // outer glow
  if (glow > 0) { const g = c.createRadialGradient(cx, cy, r * 0.8, cx, cy, r * 1.6); g.addColorStop(0, `rgba(150,65,253,${0.45 * glow})`); g.addColorStop(1, 'rgba(150,65,253,0)'); c.fillStyle = g; c.fillRect(cx - r * 1.7, cy - r * 1.7, r * 3.4, r * 3.4); }

  let g = c.createRadialGradient(cx - r * .35, cy - r * .4, r * .1, cx, cy, r);
  g.addColorStop(0, '#8E4BFF'); g.addColorStop(.55, '#5A1FC4'); g.addColorStop(1, '#1E0856');

  const vis = BALL.map(f => ({ f, cz: rot3(f.c, ax, ay, az)[2] })).filter(o2 => o2.cz > -0.15).sort((p1, p2) => p1.cz - p2.cz);
  c.save(); c.beginPath(); c.arc(cx, cy, r, 0, 7); c.clip();
  for (const { f } of vis) {
    const n = rot3(f.c, ax, ay, az);
    const lam = Math.max(0, n[0] * L[0] + n[1] * L[1] + n[2] * L[2]);
    const shade = 0.28 + 0.72 * lam;
    const col = f.hex ? [132, 70, 255] : [70, 26, 170];
    c.fillStyle = `rgb(${col.map(v => Math.round(v * shade)).join(',')})`;
    c.beginPath();
    f.poly.forEach((q, i) => { const p = rot3(q, ax, ay, az); const sx = cx + p[0] * r * 0.985, sy = cy + p[1] * r * 0.985; i ? c.lineTo(sx, sy) : c.moveTo(sx, sy); });

  c.fillStyle = g; c.beginPath(); c.arc(cx, cy, r, 0, 7); c.fill();
  c.strokeStyle = 'rgba(200,160,255,0.35)'; c.lineWidth = r * 0.03; c.beginPath(); c.arc(cx, cy, r * 0.985, Math.PI * 0.1, Math.PI * 0.9); c.stroke();
  c.restore();
}

/* ---------- icons ---------- */
function tgIcon(cx, cy, r, a = 1) {
  if (a <= 0) return;
  c.save(); c.globalAlpha *= a;

      rimLight(im, x, y, w, h, P.lime, 0.55, 6, -4, 3); rimLight(im, x, y, w, h, P.violet, 0.8, -7, -6, 3);
      c.drawImage(im, x, y, w, h);
    }
    const fl = [EV.juntanos, EV.juntanos + BEAT * 1.5, EV.juntanos + BEAT * 2.5].reduce((m2, tt) => t >= tt ? Math.max(m2, 1 - prog(t, tt, tt + 0.12)) : m2, 0);
    if (fl > 0) { c.fillStyle = `rgba(200,240,0,${0.35 * fl})`; c.fillRect(0, 0, W, H); }
    // JUNTA-NOS.
    const sl = eOutExpo(prog(t, EV.juntanos, EV.juntanos + 0.35));
    c.fillStyle = P.lime; slantRect(W / 2 - 700 * sl - 30, 868, 1400 * sl, 170); c.fill();
    rise(['JUNTA-NOS.'], W / 2, 1000, 170, t, EV.juntanos + 0.05, null, { col: P.cta, it: true });
    return;
  }
  // ball flies in → becomes the logo ball
  stage(t, { base: P.purple, light: 1.2, center: 0.8 });
  const LW = 1300, LX = W / 2 - LW / 2, LY = H / 2 - LW * LOGO_H / LOGO_W / 2, s = LW / LOGO_W;
  const ball = CorvoLogo.data.ball, bx = LX + ball[0] * s, by = LY + ball[1] * s, br = ball[2] * s;
  const fp = prog(t, EV.ball, EV.logo2);
  if (fp < 1) {
    const e = eOutCubic(fp);
    const x = lerp(2050, bx, e), y = lerp(1250, by, e) - Math.sin(Math.PI * fp) * 180, r = lerp(260, br, eInOutCubic(fp));
    drawBall(x, y, r, t * 9, t * 6, t * 2, { glow: 0.8 });
    return;
  }
  const lp = prog(t, EV.logo2, EV.logo2 + 0.45);
  const burst = pulse(t, EV.logo2, EV.logo2 + 1.2, 0.06);
  if (burst > 0) { const g = c.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, 1100); g.addColorStop(0, `rgba(200,240,0,${0.3 * burst})`); g.addColorStop(.4, `rgba(150,65,253,${0.3 * burst})`); g.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = g; c.fillRect(0, 0, W, H); }
  const zoom = 1 + 0.04 * prog(t, EV.logo2, EV.telegram);
  const outP = eInCubic(prog(t, EV.out5, EV.telegram));
  c.save(); c.translate(W / 2, H / 2); c.scale(zoom * (1 + outP * 1.5), zoom * (1 + outP * 1.5)); c.translate(-W / 2, -H / 2); c.globalAlpha = 1 - outP;
  // the flying ball has become the logo ball: lockup assembles around it
  const sa = eOutExpo(lp), wa = eOutExpo(prog(t, EV.logo2 + 0.06, EV.logo2 + 0.5)), ta = eOutBack(prog(t, EV.logo2 + 0.18, EV.logo2 + 0.55), 2);
  c.save(); c.translate(bx, by); c.scale(lerp(1.25, 1, sa), lerp(1.25, 1, sa)); c.translate(-bx, -by);
  CorvoLogo.draw(c, LX, LY, LW, { symbol: 1, word: 0, tag: 0 }); c.restore();
  c.save(); c.beginPath(); c.rect(LX + 185 * s, 0, W, H); c.clip();
  CorvoLogo.draw(c, LX - (1 - wa) * 140, LY, LW, { symbol: 0, word: clamp(wa * 1.5), tag: 0 });
  c.restore();
  const tagC = [LX + 690 * s, LY + 92 * s];
  c.save(); c.translate(tagC[0], tagC[1]); c.scale(ta, ta); c.translate(-tagC[0], -tagC[1]); CorvoLogo.draw(c, LX, LY, LW, { symbol: 0, word: 0, tag: clamp(ta) }); c.restore();
  logoShine(W / 2, H / 2, LW, prog(t, EV.logo2 + 0.5, EV.logo2 + 1.3));
  c.restore();
}

// ---------- E · 21.67 – 30 : CONVERSION ----------
function marquee(y, dir, t, a) {
  if (a <= 0) return;
  c.save(); c.globalAlpha = a;
  c.fillStyle = P.lime; c.fillRect(-10, y, W + 20, 88);
  M(40, 800); const label = 'SEM QUALQUER CUSTO', unit = c.measureText(label).width + 150;
  const off = ((t * 260 * dir) % unit + unit) % unit;
  c.fillStyle = P.cta;
  for (let x = -unit + off; x < W + unit; x += unit) { c.fillText(label, x, y + 58); arrowNE(x + unit - 105, y + 44, 30, P.cta); }
  c.restore();
}
function sceneE(t) {
  stage(t, { base: P.purple, light: 0.75, center: 0.5 });
  if (t < EV.final) {
    // ENTRA NO TELEGRAM (+ paper plane flight)
    const fp = prog(t, EV.telegram - 0.25, EV.telegram + 0.55);
    const icx = W / 2, icy = 300, ir = 118;
    const gr = prog(t, EV.gratis - 0.05, EV.gratis + 0.35);
    const headerK = eInOutCubic(gr);
    // header state (moves up and shrinks when É GRÁTIS arrives)
    c.save();
    c.translate(W / 2, lerp(0, 38, headerK)); c.scale(lerp(1, 0.5, headerK), lerp(1, 0.5, headerK)); c.translate(-W / 2, 0);
    if (fp > 0) {
      if (fp < 1) {
        const p = eOutCubic(fp), x = lerp(-150, icx, p), y = lerp(900, icy, p) - Math.sin(Math.PI * p) * 260;
        c.save(); c.strokeStyle = 'rgba(255,255,255,0.35)'; c.lineWidth = 4; c.setLineDash([2, 18]);
        c.beginPath(); for (let k = 0; k <= 24; k++) { const q = k / 24 * p, xx = lerp(-150, icx, q), yy = lerp(900, icy, q) - Math.sin(Math.PI * q) * 260; k ? c.lineTo(xx, yy) : c.moveTo(xx, yy); } c.stroke(); c.restore();
        c.save(); c.translate(x, y); c.rotate(-0.5 * (1 - p)); plane(0, 0, 150 + 60 * p, '#FFFFFF'); c.restore();
      }
      const ci = eOutBack(prog(t, EV.telegram + 0.4, EV.telegram + 0.8), 2.2);
      if (ci > 0) { c.save(); c.translate(icx, icy); c.scale(ci, ci); c.translate(-icx, -icy); tgIcon(icx, icy, ir); c.restore(); }
    }
    rise(['ENTRA', 'NO'], W / 2, 620, 150, t, EV.telegram, null, { w: 800 });
    rise(['TELEGRAM.'], W / 2, 850, 240, t, EV.telegram + 0.12, null, { col: P.lime });
    c.restore();
    // É GRÁTIS.
    if (t >= EV.gratis - 0.02) {
      const hold = prog(t, EV.pause, EV.final);
      const s = 1 + 0.035 * hold;
      c.save(); c.translate(W / 2, 700); c.scale(s, s); c.translate(-W / 2, -700);
      slam('É GRÁTIS.', W / 2 + 20, 830, 320, t, EV.gratis, { it: true, col: P.lime, s0: 2.2, dur: 0.4 });
      c.restore();
      const ma = eOutExpo(prog(t, EV.gratis, EV.gratis + 0.35));
      const mt = Math.min(t, EV.pause);
      c.save(); c.translate(0, -(1 - ma) * 140); marquee(-8, 1, mt, ma); c.restore();
      c.save(); c.translate(0, (1 - ma) * 140); marquee(H - 80, -1, mt, ma); c.restore();
    }
    return;
  }
  // FINAL CTA (complete by ~25.8 s, held to the end)
  const f = t - EV.final;
  const flash = 1 - prog(f, 0, 0.2);
  const ballA = eOutCubic(prog(f, 0.1, 0.8));
  drawBall(1760 + Math.sin(t * 0.5) * 6, 120, 190, t * 0.35, t * 0.5, 0.2, { a: ballA, glow: 0.5 });
  drawBall(150 + Math.cos(t * 0.45) * 6, 975, 230, t * 0.3 + 2, -t * 0.4, 0.4, { a: ballA, glow: 0.5 });
  const LY = 238, LWf = 1040;
  const lp = eOutExpo(prog(f, 0, 0.45));
  c.save(); c.translate(W / 2, LY); c.scale(lerp(1.18, 1, lp), lerp(1.18, 1, lp)); c.translate(-W / 2, -LY); c.globalAlpha = clamp(lp * 3);
  logoAt(W / 2, LY, LWf); c.restore();
  logoShine(W / 2, LY, LWf, prog(f, 0.5, 1.3));
  const sp = eOutCubic(prog(f, 0.3, 0.7));
  if (sp > 0) {
    M(38, 700); const label = 'Mais de 41 mil subscritores', lw = c.measureText(label).width;
    const pw = lw + 110, x = W / 2 - pw / 2, y = 410;
    c.save(); c.globalAlpha = sp; c.translate(0, (1 - sp) * 20);
    c.fillStyle = 'rgba(23,19,60,0.9)'; rr(x, y, pw, 72, 36); c.fill(); c.strokeStyle = 'rgba(200,240,0,0.5)'; c.lineWidth = 2; c.stroke();
    tgIcon(x + 42, y + 36, 21);
    c.fillStyle = P.white; c.fillText(label, x + 76, y + 49);
    c.restore();
  }
  const cp = eOutBack(prog(f, 0.45, 0.9), 1.6);
  if (cp > 0) {
    M(64, 900); const label = 'ADERIR À COMUNIDADE', lw = c.measureText(label).width;
    const bw = lw + 230, bh = 150, bx = W / 2 - bw / 2, by = 530;
    const glowP = 0.6 + 0.4 * Math.sin((t - EV.final) * 3.2);
    c.save(); c.translate(W / 2, by + bh / 2); c.scale(cp, cp); c.translate(-W / 2, -(by + bh / 2));
    c.shadowColor = rgba(P.lime, 0.45 * glowP); c.shadowBlur = 70;
    c.fillStyle = P.lime; rr(bx, by, bw, bh, 28); c.fill(); c.shadowBlur = 0;
    tgIcon(bx + 92, by + bh / 2, 45);
    c.fillStyle = P.cta; c.fillText(label, bx + 166, by + 98);
    const shx = lerp(bx - 200, bx + bw + 200, prog(f, 1.0, 1.7));
    c.save(); rr(bx, by, bw, bh, 28); c.clip(); const sg = c.createLinearGradient(shx - 90, 0, shx + 90, 0);
    sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(.5, 'rgba(255,255,255,0.45)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = sg; c.fillRect(shx - 90, by, 180, bh); c.restore();
    c.restore();
  }
  txt('O teu lugar é aqui.', W / 2, 800, 58, { w: 600, it: true, align: 'center', a: eOutCubic(prog(f, 0.75, 1.15)) });
  txt('18+ | Joga com responsabilidade.', W / 2, 1036, 28, { w: 600, align: 'center', col: 'rgba(255,255,255,0.8)', a: eOutCubic(prog(f, 0.9, 1.3)) });
  if (flash > 0) { c.save(); c.globalCompositeOperation = 'lighter'; c.fillStyle = `rgba(150,190,40,${0.55 * flash * flash})`; c.fillRect(0, 0, W, H); c.restore(); }
}

/* =====================================================================
   COMPOSITION
   ===================================================================== */
function transitionMask(t) { /* reserved */ }
function drawScene(t) {
  reset(c);
  c.fillStyle = '#050508'; c.fillRect(0, 0, W, H);
  if (t < EV.phone) sceneA(t);
  else if (t < EV.m1) {
    sceneB(t);
    if (t >= EV.out2) {   // whip into C1
      c.save(); c.beginPath(); const p = eInOutCubic(prog(t, EV.out2, EV.m1 + 0.03)); c.rect(W - p * W * 1.05, 0, W * 1.3, H); c.clip(); sceneC1(t); c.restore();
    }
  }
  else if (t < EV.m2) {
    sceneC1(t);
    if (t >= EV.ballWipe) {   // ball wipe into C2
      const p = prog(t, EV.ballWipe, EV.m2 + 0.1), bx = lerp(-200, 1100, eOutCubic(p)), by = lerp(820, 540, eOutCubic(p)) - Math.sin(Math.PI * p) * 120;
      const rad = eInCubic(clamp((p - 0.25) / 0.75)) * 2400;
      c.save(); c.beginPath(); c.arc(bx, by, rad, 0, 7); c.clip(); sceneC2(t); c.restore();
      drawBall(bx, by, 150 - 60 * p, t * 12, t * 7, 0, { a: 1 - prog(p, 0.75, 1), glow: 0.8 });
    }
  }
  else if (t < EV.m3) {
    sceneC2(t);
    if (t >= EV.out4) {   // slanted lime band wipe into C3
      const p = eInOutCubic(prog(t, EV.out4, EV.m3 + 0.12));
      const x = lerp(W + 300, -900, p);
      c.save(); c.beginPath(); c.moveTo(x + 380, -20); c.lineTo(W + 600, -20); c.lineTo(W + 600, H + 20); c.lineTo(x + 380 - (H + 40) * SLANT, H + 20); c.closePath(); c.clip(); sceneC3(t); c.restore();
      c.fillStyle = P.lime; c.beginPath(); c.moveTo(x, -20); c.lineTo(x + 380, -20); c.lineTo(x + 380 - (H + 40) * SLANT, H + 20); c.lineTo(x - (H + 40) * SLANT, H + 20); c.closePath(); c.fill();
    }
  }
  else if (t < EV.drop) sceneC3(t);
  else if (t < EV.telegram) sceneD(t);
  else sceneE(t);
}
// grain + vignette
const NOISE = Array.from({ length: 3 }, (_, k) => {
  const g = mk(256, 256), gx = g.getContext('2d'), id = gx.createImageData(256, 256), r = mulberry32(k + 3);
  for (let i = 0; i < id.data.length; i += 4) { const v = r() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  gx.putImageData(id, 0, 0); return g;
});
function post(t) {
  reset(out);
  const v = out.createRadialGradient(W / 2, H / 2, 520, W / 2, H / 2, 1250);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.5)');
  out.fillStyle = v; out.fillRect(0, 0, W, H);
  const f = Math.floor(Math.min(t, EV.final + 1.2) * FPS);
  out.globalCompositeOperation = 'overlay'; out.globalAlpha = 0.07;
  out.fillStyle = out.createPattern(NOISE[f % 3], 'repeat'); out.save(); out.translate((f * 37) % 256, (f * 91) % 256); out.fillRect(-256, -256, W + 512, H + 512); out.restore();
  reset(out);
}
let prefetchP = null;
async function renderFrame(t) {
  if (prefetchP) { await prefetchP; prefetchP = null; }
  const n = t >= EV.final + 1.25 ? 1 : SUB;
  const times = Array.from({ length: n }, (_, i) => t + (n > 1 ? (i / n) * (SHUTTER / FPS) : 0));
  for (let pass = 0; pass < 3; pass++) {       // redraw only if a footage frame was missing
    FS.misses.clear(); reset(out);
    times.forEach((ts, i) => { drawScene(ts); out.globalAlpha = 1 / (i + 1); out.drawImage(sceneC, 0, 0); });
    out.globalAlpha = 1;
    if (!FS.misses.size) break;
    await FS.fill();
  }
  post(t);
  // prefetch the footage for the next frame while this one is being encoded
  FS.misses.clear(); drawScene(t + 1 / FPS);
  if (FS.misses.size) prefetchP = FS.fill();
}
window.renderFrame = renderFrame;
window.META = { W, H, FPS, DUR };
window.ready = (async () => {
  await Promise.all([document.fonts.load('900 40px Montserrat'), document.fonts.load('italic 900 40px Montserrat'), document.fonts.load('800 40px Montserrat'), document.fonts.load('600 40px Montserrat'), document.fonts.load('italic 600 40px Montserrat'), document.fonts.load('700 40px Roboto'), document.fonts.load('400 40px Roboto')]);
  await CorvoLogo.load('brand/logo-paths.json');
  const clips = await loadJSON('assets/clips.json');
  for (const [k, v] of Object.entries(clips)) if (v.count) CLIPS[k] = v;
  CLIPS.ravenA_meta = (await loadJSON('assets/ravenA/meta.json')).frames;
  for (const k of ['photo1', 'photo2']) { IMG[k] = await loadImage(`assets/${k}.jpg`); IMG[k + '_cut'] = await loadImage(`assets/${k}_cut.webp`); }
  buildCards();
  return true;
})();

if (!RENDER) {
  const audio = new Audio('corvo-audio.wav');
  let t0 = null, busy = false;
  window.ready.then(() => {
    const loop = async now => {
      if (t0 === null) t0 = now;
      if (!busy) { busy = true; await renderFrame(((now - t0) / 1000) % DUR); busy = false; }
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  });
  cv.addEventListener('click', () => { t0 = null; audio.currentTime = 0; audio.play().catch(() => {}); });
}
</script>
