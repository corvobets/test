<!doctype html>
<html lang="pt-PT">

<title>BankFlow — 30s</title>
<style>
  @font-face { font-family: 'Space Grotesk'; src: url(fonts/spacegrotesk.woff2) format('woff2'); font-weight: 300 700; }
  @font-face { font-family: 'Inter'; src: url(fonts/inter.woff2) format('woff2'); font-weight: 100 900; }
  html, body { margin: 0; background: #0D1120; height: 100%; }
  body { display: grid; place-items: center; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; }
  body.render canvas { max-width: none; max-height: none; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
/* =====================================================================
   BANKFLOW — 30s product film · 1920×1080 · 60 fps
   renderFrame(t) draws the frame at time t (seconds). Deterministic.
   ?render  headless render mode   ?sub=3  motion-blur subsamples
   ===================================================================== */
const Q = new URLSearchParams(location.search);
const W = 1920, H = 1080, FPS = 60, DUR = 30;
const SUB = +(Q.get('sub') || 3), SHUTTER = 0.5;
const RENDER = Q.has('render');
if (RENDER) document.body.classList.add('render');

const cv = document.getElementById('cv'); cv.width = W; cv.height = H;
const out = cv.getContext('2d');
const mk = (w = W, h = H) => { const k = document.createElement('canvas'); k.width = w; k.height = h; return k; };
const sceneC = mk(), c = sceneC.getContext('2d');

/* ---------- brand ---------- */
const P = {
  bg: '#0D1120', bg2: '#101425', card: '#13182B', card2: '#202539',
  text: '#EEF0FA', mute: '#8B93B0', mute2: '#5E6683', line: 'rgba(238,240,250,0.08)', line2: 'rgba(238,240,250,0.14)',
  blue: '#2E9EE6', teal: '#14D7C4', violet: '#8B5CF6',
  cta1: '#5855E8', cta2: '#783DEC',
  pos: '#35D581', neg: '#FF4567',
  label: '#8E8CF8',
  // imported content (not brand colours)
  slipOrange: '#F3511D', slipBody: '#151A26', slipRow: '#1E2433', slipChip: '#343A4F', slipGreen: '#37B45E',
  tg: '#2AABEE', tgOut: '#2B5278', tgIn: '#1F2B3B', xl: '#107C41', xlSel: '#21A366',
};
const HEAD = '"Space Grotesk"', UI = '"Inter"';
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };

/* ---------- math ---------- */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, t) => a + (b - a) * t;
const eOutExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const eInExpo = x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10);
const eOutCubic = x => 1 - Math.pow(1 - x, 3);
const eInCubic = x => x * x * x;
const eInOutCubic = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eInOutSine = x => -(Math.cos(Math.PI * x) - 1) / 2;
const eOutQuart = x => 1 - Math.pow(1 - x, 4);
const eOutBack = (x, s = 1.4) => x <= 0 ? 0 : 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
const pulse = (t, a, b, fade = .25) => Math.min(eOutCubic(prog(t, a, a + fade)), 1 - eInCubic(prog(t, b - fade, b)));
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const lerpRect = (a, b, p) => ({ x: lerp(a.x, b.x, p), y: lerp(a.y, b.y, p), w: lerp(a.w, b.w, p), h: lerp(a.h, b.h, p) });
// keyframed value: [[t, v], ...] with eased segments
function kf(t, keys, ease = eInOutCubic) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) {
    const [t0, v0] = keys[i - 1], [t1, v1] = keys[i];
    return lerp(v0, v1, ease(prog(t, t0, t1)));
  }
  return keys[keys.length - 1][1];
}

/* ---------- drawing helpers ---------- */
function reset(ctx = c) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.shadowBlur = 0; ctx.shadowColor = 'transparent'; ctx.letterSpacing = '0px'; ctx.setLineDash([]);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.filter = 'none';
}
function font(size, fam = UI, w = 500) { c.font = `${w} ${size}px ${fam}, "Inter", sans-serif`; }
function tw(s, size, fam = UI, w = 500, ls = 0) { font(size, fam, w); c.letterSpacing = ls + 'px'; const m = c.measureText(s).width; c.letterSpacing = '0px'; return m; }
function text(s, x, y, size, o = {}) {
  const { fam = UI, w = 500, col = P.text, align = 'left', ls = 0, a = 1 } = o;
  if (a <= 0) return;
  font(size, fam, w); c.letterSpacing = ls + 'px'; c.textAlign = align; c.fillStyle = col;
  const ga = c.globalAlpha; c.globalAlpha = ga * a;
  c.fillText(s, align === 'center' ? x + ls / 2 : x, y);
  c.globalAlpha = ga; c.letterSpacing = '0px'; c.textAlign = 'left';
}
function rr(x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
function brandGrad(x0, x1, y = 0) {
  const g = c.createLinearGradient(x0, y, x1, y);
  g.addColorStop(0, P.blue); g.addColorStop(.5, P.teal); g.addColorStop(1, P.violet); return g;
}
function ctaGrad(x0, x1) { const g = c.createLinearGradient(x0, 0, x1, 0); g.addColorStop(0, P.cta1); g.addColorStop(1, P.cta2); return g; }
function panel(x, y, w, h, o = {}) {
  const { r = 22, fill = P.card, stroke = P.line, a = 1, shadow = true } = o;
  if (a <= 0) return;
  c.save(); c.globalAlpha *= a;
  if (shadow) { c.shadowColor = 'rgba(0,0,0,.45)'; c.shadowBlur = 50; c.shadowOffsetY = 18; }
  c.fillStyle = fill; rr(x, y, w, h, r); c.fill();
  c.shadowBlur = 0; c.shadowOffsetY = 0;
  c.strokeStyle = stroke; c.lineWidth = 1.5; c.stroke();
  // top sheen
  const g = c.createLinearGradient(0, y, 0, y + 60); g.addColorStop(0, 'rgba(238,240,250,.045)'); g.addColorStop(1, 'rgba(238,240,250,0)');
  c.fillStyle = g; rr(x, y, w, Math.min(h, 60), r); c.fill();
  c.restore();
}
function glowStroke(x, y, w, h, r, a) {
  if (a <= 0) return;
  c.save(); c.globalAlpha *= a;
  c.shadowColor = rgba(P.teal, .55); c.shadowBlur = 36;
  c.strokeStyle = brandGrad(x, x + w); c.lineWidth = 2.5; rr(x, y, w, h, r); c.stroke();
  c.restore();
}
function chip(x, y, label, o = {}) {
  const { size = 20, h = 40, fill = P.card2, stroke = P.line2, col = P.text, w = 600, pad = 16, icon = null, a = 1 } = o;
  const iw = icon ? size * 1.1 : 0;
  const cw = tw(label, size, UI, w) + pad * 2 + iw;
  if (a > 0) {
    c.save(); c.globalAlpha *= a;
    c.fillStyle = fill; rr(x, y, cw, h, h / 2 < 14 ? h / 2 : 12); c.fill();
    c.strokeStyle = stroke; c.lineWidth = 1.2; c.stroke();
    if (icon) icon(x + pad + size * .4, y + h / 2, size * .8, col);
    text(label, x + pad + iw, y + h / 2 + size * .36, size, { w, col });
    c.restore();
  }
  return cw;
}

/* ---------- icons ---------- */
function icCheck(x, y, r, col = P.pos) {
  c.save(); c.fillStyle = rgba(col, .16); c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
  c.strokeStyle = col; c.lineWidth = r * .16; c.beginPath(); c.moveTo(x - r * .4, y + r * .02); c.lineTo(x - r * .1, y + r * .32); c.lineTo(x + r * .45, y - r * .3); c.stroke(); c.restore();
}
function icArrow(x, y, s, col) {
  c.save(); c.strokeStyle = col; c.lineWidth = s * .13; c.beginPath();
  c.moveTo(x - s * .45, y); c.lineTo(x + s * .4, y); c.moveTo(x + s * .05, y - s * .35); c.lineTo(x + s * .42, y); c.lineTo(x + s * .05, y + s * .35); c.stroke(); c.restore();
}
function icReceipt(x, y, s, col) {
  c.save(); c.strokeStyle = col; c.lineWidth = s * .09;
  rr(x - s * .32, y - s * .42, s * .64, s * .84, s * .1); c.stroke();
  c.beginPath(); for (const k of [-.15, .05, .25]) { c.moveTo(x - s * .16, y + k * s); c.lineTo(x + s * .16, y + k * s); } c.stroke(); c.restore();
}
function icPlane(x, y, s, col = '#fff') {
  c.save(); c.fillStyle = col; c.beginPath();
  c.moveTo(x - s * .42, y - s * .02); c.lineTo(x + s * .4, y - s * .36); c.lineTo(x + s * .22, y + s * .38); c.lineTo(x + s * .02, y + s * .12);
  c.lineTo(x + s * .26, y - s * .18); c.lineTo(x - s * .06, y + s * .06); c.closePath(); c.fill(); c.restore();
}
function icLive(x, y, s, col) {
  c.save(); c.strokeStyle = col; c.fillStyle = col; c.lineWidth = s * .1;
  c.beginPath(); c.arc(x, y, s * .1, 0, 7); c.fill();
  for (const r of [.28, .46]) { c.beginPath(); c.arc(x, y, s * r, -0.8, 0.8); c.stroke(); c.beginPath(); c.arc(x, y, s * r, Math.PI - .8, Math.PI + .8); c.stroke(); }
  c.restore();
}
function icSpark(x, y, s, col) {
  c.save(); c.fillStyle = col; c.beginPath();
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, r = i % 2 ? s * .12 : s * .5; c.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); }
  c.closePath(); c.fill();
  c.beginPath(); for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, r = i % 2 ? s * .05 : s * .2; c.lineTo(x + s * .42 + Math.cos(a) * r, y - s * .38 + Math.sin(a) * r); } c.closePath(); c.fill();
  c.restore();
}
function icClock(x, y, s, col) {
  c.save(); c.strokeStyle = col; c.lineWidth = s * .1; c.beginPath(); c.arc(x, y, s * .4, 0, 7); c.stroke();
  c.beginPath(); c.moveTo(x, y - s * .22); c.lineTo(x, y); c.lineTo(x + s * .16, y + s * .1); c.stroke(); c.restore();
}
function icTrend(x, y, s, col) {
  c.save(); c.strokeStyle = col; c.lineWidth = s * .11; c.beginPath();
  c.moveTo(x - s * .45, y + s * .25); c.lineTo(x - s * .1, y - s * .08); c.lineTo(x + s * .08, y + s * .1); c.lineTo(x + s * .45, y - s * .28);
  c.moveTo(x + s * .18, y - s * .3); c.lineTo(x + s * .45, y - s * .28); c.lineTo(x + s * .43, y - s * .02); c.stroke(); c.restore();
}
function icInfo(x, y, s, col) {
  c.save(); c.strokeStyle = col; c.fillStyle = col; c.lineWidth = s * .09; c.beginPath(); c.arc(x, y, s * .42, 0, 7); c.stroke();
  c.fillRect(x - s * .045, y - s * .05, s * .09, s * .28); c.beginPath(); c.arc(x, y - s * .2, s * .06, 0, 7); c.fill(); c.restore();
}
function icLayers(x, y, s, col) {
  c.save(); c.strokeStyle = col; c.lineWidth = s * .09;
  for (const dy of [-.18, 0, .18]) { c.beginPath(); c.moveTo(x - s * .42, y + dy * s); c.lineTo(x, y + dy * s - s * .18); c.lineTo(x + s * .42, y + dy * s); c.lineTo(x, y + dy * s + s * .18); c.closePath(); if (dy < 0) c.stroke(); else { c.beginPath(); c.moveTo(x - s * .42, y + dy * s); c.lineTo(x, y + dy * s + s * .18); c.lineTo(x + s * .42, y + dy * s); c.stroke(); } }
  c.restore();
}

/* ---------- kinetic type ---------- */
// words: [{t, g}] ; g = brand-gradient word
function kLine(words, x, y, size, t, tIn, tOut = null, o = {}) {
  const { align = 'left', fam = HEAD, w = 700, stagger = .055, dur = .75, col = P.text, a = 1 } = o;
  font(size, fam, w);
  const sp = c.measureText(' ').width;
  let cx = 0; const items = words.map(wd => { const ww = c.measureText(wd.t).width; const it = { ...wd, x: cx, w: ww }; cx += ww + sp; return it; });
  const total = cx - sp, x0 = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  const gs = items.filter(i => i.g);
  const grad = gs.length ? brandGrad(x0 + gs[0].x, x0 + gs[gs.length - 1].x + gs[gs.length - 1].w) : null;
  c.save(); c.globalAlpha *= a;
  c.beginPath(); c.rect(x0 - 30, y - size * 1.02, total + 60, size * 1.34); c.clip();
  items.forEach((it, i) => {
    const pin = eOutExpo(prog(t, tIn + i * stagger, tIn + i * stagger + dur));
    const pout = tOut == null ? 0 : eInCubic(prog(t, tOut + i * stagger * .6, tOut + i * stagger * .6 + .38));
    if (pin <= 0 || pout >= 1) return;
    const dy = (1 - pin) * size * 1.1 - pout * size * 1.15;
    c.fillStyle = it.g ? grad : (it.c || col);
    c.fillText(it.t, x0 + it.x, y + dy);
  });
  c.restore();
  return total;
}
const Wd = s => s.split(' ').map(t => ({ t: t.replace(/\*/g, ''), g: t.includes('*') }));

/* =====================================================================
   DATA (illustrative)
   ===================================================================== */
const eur = v => (v < 0 ? '−' : '+') + Math.abs(v).toFixed(2).replace('.', ',') + ' €';
function bet(m, k, o, s, st, src) { const r = st > 0 ? eur(s * (o - 1)) : st < 0 ? eur(-s) : 'Pendente'; return { m, k, o: o.toFixed(2), s: s + ' €', r, st, src }; }
const HISTORY = [
  bet('Santa Clara Sub-23 + CA Lanús', 'Múltipla · 2 linhas', 3.15, 10, 0, 'Print · IA'),
  bet('Benfica – Porto', 'Resultado final · Benfica', 1.85, 10, 1, 'Telegram'),
  bet('Real Madrid – Sevilha', 'Mais de 2.5 golos', 1.72, 15, 1, 'Excel'),
  bet('Arsenal – Chelsea', 'Ambas marcam', 1.95, 10, -1, 'Telegram'),
  bet('Sporting – Braga', 'Resultado final · Sporting', 1.66, 12, 1, 'Print · IA'),
  bet('Inter – Milan', 'Menos de 2.5 golos', 2.05, 10, -1, 'Excel'),

// batch imports (Telegram / Excel)
const BATCHES = [
  { src: 'Telegram', t: 7.55, rows: [bet('Benfica – Porto', 'Resultado final · Benfica', 1.85, 10, 1, 'Telegram'), bet('Arsenal – Chelsea', 'Ambas marcam', 1.95, 10, -1, 'Telegram'), bet('Liverpool – Man. City', 'Ambas marcam', 1.62, 10, 1, 'Telegram'), bet('Ajax – PSV', 'Mais de 2.5 golos', 1.58, 20, 1, 'Telegram')] },
  { src: 'Excel', t: 8.2, rows: [bet('Real Madrid – Sevilha', 'Mais de 2.5 golos', 1.72, 15, 1, 'Excel'), bet('Inter – Milan', 'Menos de 2.5 golos', 2.05, 10, -1, 'Excel'), bet('Sporting – Braga', 'Resultado final · Sporting', 1.66, 12, 1, 'Excel'), bet('Napoli – Roma', 'Dupla hipótese 1X', 1.40, 25, 1, 'Excel')] },
  { src: 'Telegram', t: 8.85, rows: [bet('FC Porto – Vitória SC', 'Handicap −1', 2.20, 8, 1, 'Telegram'), bet('Bayern – Dortmund', 'Ambas marcam', 1.55, 10, -1, 'Telegram'), bet('Atlético – Betis', 'Menos de 3.5 golos', 1.45, 20, 1, 'Telegram'), bet('PSG – Lyon', 'Resultado final · PSG', 1.50, 15, 1, 'Telegram')] },
  { src: 'Excel', t: 9.45, rows: [bet('Celtic – Rangers', 'Ambas marcam', 1.70, 10, 1, 'Excel'), bet('Juventus – Lazio', 'Mais de 1.5 golos', 1.33, 30, 1, 'Excel'), bet('Braga – Guimarães', 'Resultado final · Braga', 2.10, 10, -1, 'Excel'), bet('Man. United – Spurs', 'Ambas marcam', 1.65, 10, 1, 'Excel')] },

const TG_MSGS = [
  'Benfica – Porto · Benfica @1.85 · 10€', 'Arsenal – Chelsea · BTTS @1.95 · 10€', 'Liverpool – Man. City · BTTS @1.62 · 10€', 'Ajax – PSV · +2.5 @1.58 · 20€',
  'FC Porto – Vitória SC · HC −1 @2.20 · 8€', 'Bayern – Dortmund · BTTS @1.55 · 10€', 'Atlético – Betis · −3.5 @1.45 · 20€', 'PSG – Lyon · PSG @1.50 · 15€',
];
const XL_ROWS = [
  ['14/09', 'Real Madrid – Sevilha', '+2.5', '1.72', '15'], ['14/09', 'Inter – Milan', '−2.5', '2.05', '10'], ['15/09', 'Sporting – Braga', '1', '1.66', '12'], ['15/09', 'Napoli – Roma', '1X', '1.40', '25'],
  ['16/09', 'Celtic – Rangers', 'BTTS', '1.70', '10'], ['16/09', 'Juventus – Lazio', '+1.5', '1.33', '30'], ['17/09', 'Braga – Guimarães', '1', '2.10', '10'], ['17/09', 'Man. United – Spurs', 'BTTS', '1.65', '10'],
];
// bankroll evolution (24 days): 1 000 € → 1 240 €, with realistic dips
const BANK = [1000, 1012, 1004, 1031, 1022, 1049, 1040, 1066, 1051, 1038, 1070, 1094, 1083, 1111, 1101, 1133, 1126, 1152, 1137, 1171, 1192, 1180, 1214, 1240];

/* =====================================================================
   COMPONENTS
   ===================================================================== */
const srcCol = s => s === 'Telegram' ? P.tg : s === 'Excel' ? P.xlSel : P.violet;
// one bet row (native width w, height h)
function drawRow(r, x, y, w, h, o = {}) {
  const { a = 1, flash = 0, fill = 'rgba(32,37,57,.72)' } = o;
  if (a <= 0) return;
  c.save(); c.globalAlpha *= a;
  c.fillStyle = fill; rr(x, y, w, h, 14); c.fill();
  c.strokeStyle = flash > 0 ? rgba(P.teal, .25 + .5 * flash) : P.line; c.lineWidth = 1.2 + flash; c.stroke();
  if (flash > 0) { c.fillStyle = rgba(P.teal, .08 * flash); c.fill(); }
  const cy = y + h / 2, dc = r.st > 0 ? P.pos : r.st < 0 ? P.neg : P.mute;
  c.fillStyle = dc; c.beginPath(); c.arc(x + 26, cy, 6, 0, 7); c.fill();
  c.fillStyle = rgba(dc, .2); c.beginPath(); c.arc(x + 26, cy, 11, 0, 7); c.fill();
  text(r.m, x + 50, cy - 5, 21, { w: 600 });
  text(r.k, x + 50, cy + 21, 16, { col: P.mute });
  if (r.src) {
    const kx = x + 50 + tw(r.k, 16) + 12, sc = srcCol(r.src);
    const sw = tw(r.src, 13, UI, 700) + 16;
    c.fillStyle = rgba(sc, .16); rr(kx, cy + 7, sw, 20, 10); c.fill();
    text(r.src, kx + 8, cy + 21.5, 13, { w: 700, col: sc });
  }
  text(r.o, x + w - 280, cy + 7, 21, { fam: HEAD, w: 600, align: 'right' });
  text(r.s, x + w - 172, cy + 7, 19, { col: P.mute, align: 'right' });
  if (r.st === 0) { chip(x + w - 136, cy - 16, 'Pendente', { size: 15, h: 32, pad: 12, col: P.mute, icon: icClock }); }
  else text(r.r, x + w - 22, cy + 7, 21, { fam: HEAD, w: 700, col: r.st > 0 ? P.pos : P.neg, align: 'right' });
  c.restore();
}
// betting slip (imported content) — native 620 × 790
const SLW = 620, SLH = 790;
const SLIP_F = {   // detectable fields (native coords)
  sel1: { x: 70, y: 208, w: 330, h: 128, tag: 'SELEÇÃO' }, odd1: { x: 462, y: 208, w: 120, h: 68, tag: 'ODD' },
  sel2: { x: 70, y: 374, w: 330, h: 128, tag: 'SELEÇÃO' }, odd2: { x: 462, y: 374, w: 120, h: 68, tag: 'ODD' },
  tot: { x: 440, y: 548, w: 150, h: 60, tag: 'ODD TOTAL' }, stake: { x: 400, y: 636, w: 190, h: 60, tag: 'STAKE' },
};
function drawSlip(a = 1) {
  if (a <= 0) return;
  c.save(); c.globalAlpha *= a;
  c.shadowColor = 'rgba(0,0,0,.5)'; c.shadowBlur = 60; c.shadowOffsetY = 24;
  c.fillStyle = P.slipBody; rr(0, 0, SLW, SLH, 30); c.fill(); c.shadowBlur = 0; c.shadowOffsetY = 0;
  c.save(); rr(0, 0, SLW, SLH, 30); c.clip();
  c.fillStyle = P.slipOrange; c.fillRect(0, 0, SLW, 100);
  c.restore();
  c.fillStyle = 'rgba(255,255,255,.2)'; rr(26, 22, 56, 56, 14); c.fill();
  icReceipt(54, 50, 34, '#fff');
  c.fillStyle = '#2A1A14'; c.beginPath(); c.arc(80, 24, 13, 0, 7); c.fill();
  text('2', 80, 30, 16, { w: 700, col: '#fff', align: 'center' });
  text('3.15', 100, 66, 44, { fam: HEAD, w: 700, col: '#fff' });
  c.strokeStyle = '#fff'; c.lineWidth = 3.5; c.beginPath(); c.moveTo(566, 56); c.lineTo(578, 44); c.lineTo(590, 56); c.stroke();
  text('Boletim de apostas', 30, 150, 29, { w: 700 });
  chip(528, 124, '2/30', { size: 18, h: 36, pad: 12, fill: '#262C3D', stroke: 'transparent' });
  c.strokeStyle = brandGrad(30, 590); c.lineWidth = 2.5; c.beginPath(); c.moveTo(30, 174); c.lineTo(500, 174); c.stroke();

  richLine([['No pré-jogo fechas '], ['+11%', P.pos], ['. Ao vivo, é o teu maior']], 36, 112, 29);
  richLine([['buraco: '], ['−18%', P.neg], ['.']], 36, 152, 29);
  // diverging bars
  const axis = 520, sc = 300 / 20, bp = eOutCubic(prog(t, 16.6, 17.4));
  const rowB = (yy, lab, v, col, f, dimmed) => {
    c.save(); c.globalAlpha *= dimmed;
    text(lab, 36, yy + 9, 23, { w: 600 });
    c.fillStyle = '#262B42'; rr(axis - 300, yy - 14, 600, 28, 14); c.fill();
    const len = Math.abs(v) * sc * bp;
    if (f > 0) { c.shadowColor = col; c.shadowBlur = 24 * f; }
    c.fillStyle = col; if (v > 0) rr(axis, yy - 14, len, 28, 14); else rr(axis - len, yy - 14, len, 28, 14); c.fill(); c.shadowBlur = 0;
    text((v > 0 ? '+' : '−') + Math.abs(v) + '%', v > 0 ? axis + len + 14 : axis - len - 14, yy + 9, 24, { fam: HEAD, w: 700, col, align: v > 0 ? 'left' : 'right', a: bp });
    c.restore();
  };
  rowB(222, 'Pré-jogo', 11, P.pos, fG, 1 - .55 * fB);
  rowB(282, 'Ao vivo', -18, P.neg, fB, 1 - .55 * fG);
  c.fillStyle = 'rgba(238,240,250,.35)'; c.fillRect(axis - 1, 196, 2, 112);
  insightChips(36, 336, cw - 72, 108, 'Pré-jogo · +11%', 'Ao vivo · −18%', t, fG, fB, 30);
  c.restore();
  // competition + odds cards
  const card = (yy, e, label, icon, parts, good, bad, f) => {
    if (e <= 0) return;
    c.save(); c.globalAlpha *= e; c.translate(0, yy + (1 - e) * 40);
    panel(0, 0, cw, 196, { r: 22, fill: P.card2, shadow: false, stroke: 'rgba(238,240,250,.1)' });
    glowStroke(0, 0, cw, 196, 22, f);
    icon(36, 40, 26, P.label);
    text(label, 62, 47, 18, { w: 800, col: P.label, ls: 3 });
    richLine(parts, 36, 92, 24);
    insightChips(36, 112, cw - 72, 68, good, bad, t, 0, 0, 21);
    c.restore();
  };
  card(490, eOutExpo(prog(t, 19.5, 20.1)), 'POR COMPETIÇÃO', icLayers, [['Na Liga Portugal fechas '], ['+14%', P.pos], ['. Na Premier League, '], ['−9%', P.neg], ['.']], 'Liga Portugal · +14%', 'Premier League · −9%', fC);
  card(706, eOutExpo(prog(t, 19.65, 20.25)), 'POR ODDS', icTrend, [['Até 1.90, o teu ROI é '], ['+21%', P.pos], ['. Acima de 2.50, '], ['−9%', P.neg], ['.']], 'Odds até 1.90 · +21%', 'Acima de 2.50 · −9%', fO);
  c.restore();
  c.restore();
}
function S4(t) {
  // panel grows out of the chart card
  const g = eInOutCubic(prog(t, 15.7, 16.45));
  const zc = { x: CH.x + CH.w / 2, y: CH.y + CH.h / 2 }, zs = 1.55;
  const from = { x: zc.x + (CH.x - zc.x) * zs, y: zc.y + (CH.y - zc.y) * zs, w: CH.w * zs, h: CH.h * zs };
  const R = lerpRect(from, IP, g);
  const rec = eInOutCubic(prog(t, 21.55, 22.2));             // recede behind closing line
  const conv = eInExpo(prog(t, 23.7, 24.45));                // converge to logo
  const a = prog(t, 15.75, 16.1) * (1 - .78 * rec) * (1 - conv);
  if (a > 0) {
    c.save(); c.globalAlpha = a;
    const s = (R.w / IP.w) * (1 - .1 * rec) * (1 - .9 * conv);
    const cx = lerp(R.x + R.w / 2, 960, Math.max(rec * .35, conv)), cy = lerp(R.y + R.h / 2, 540, Math.max(rec * .2, conv));
    c.translate(cx, cy); c.scale(s, (R.h / IP.h) * (1 - .1 * rec) * (1 - .9 * conv)); c.translate(-IP.w / 2, -IP.h / 2);
    drawInsights(t);
    glowStroke(0, 0, IP.w, IP.h, 28, pulse(t, 15.8, 16.8, .3));
    c.restore();
  }
  // copy (left)
  text('INTELIGÊNCIA', 130, 400, 20, { w: 700, col: P.label, ls: 4, a: pulse(t, 16.5, 21.6, .3) });
  kLine(Wd('Descobre'), 130, 510, 100, t, 16.6, 17.8);
  kLine(Wd('onde *ganhas.*'), 130, 622, 100, t, 16.7, 17.84);
  kLine(Wd('Percebe'), 130, 510, 100, t, 18.26, 21.4);
  kLine(Wd('onde *perdes.*'), 130, 622, 100, t, 18.34, 21.45);
  // closing line
  const sc = pulse(t, 21.7, 23.9, .5);
  if (sc > 0) { c.save(); c.globalAlpha = sc * .85; const g2 = c.createRadialGradient(960, 560, 0, 960, 560, 900); g2.addColorStop(0, 'rgba(13,17,32,.95)'); g2.addColorStop(1, 'rgba(13,17,32,0)'); c.fillStyle = g2; c.fillRect(0, 0, W, H); c.restore(); }
  kLine(Wd('Conhece os teus *padrões.*'), 960, 500, 104, t, 21.85, 23.6, { align: 'center' });
  kLine(Wd('Afina o teu *método.*'), 960, 640, 104, t, 22.45, 23.65, { align: 'center' });
  // Dados ilustrativos inside the panel header is drawn globally
}

/* =====================================================================
   SCENE 5 · 24–30 s · BRAND & CTA
   ===================================================================== */
function S5(t) {
  // bloom at convergence
  const bl = pulse(t, 24.25, 25.6, .35);
  if (bl > 0) {
    const g = c.createRadialGradient(960, 500, 0, 960, 500, 700);
    g.addColorStop(0, `rgba(20,215,196,${.16 * bl})`); g.addColorStop(.5, `rgba(139,92,246,${.1 * bl})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
  }
  // persistent soft halo behind logo
  const ha = eOutCubic(prog(t, 24.6, 25.8));
  if (ha > 0) {
    const g = c.createRadialGradient(960, 330, 0, 960, 330, 520);
    g.addColorStop(0, `rgba(46,158,230,${.10 * ha})`); g.addColorStop(1, 'rgba(46,158,230,0)');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
  }
  if (LOGO.complete) drawLogo(960, 320, 780, 24.55, t);
  kLine([{ t: 'Analisa' }, { t: 'o' }, { t: 'teu', g: 1 }, { t: 'jogo.', g: 1 }], 960, 575, 92, t, 25.4, null, { align: 'center' });
  kLine([{ t: 'Domina' }, { t: 'os' }, { t: 'teus', g: 1 }, { t: 'números.', g: 1 }], 960, 688, 92, t, 25.6, null, { align: 'center' });
  // CTA
  const cp = eOutBack(prog(t, 26.2, 26.75), 1.2), ca = prog(t, 26.2, 26.45);
  if (cp > 0) {
    font(31, UI, 600); const label = 'Começar a registar', lw = c.measureText(label).width;
    const bw = lw + 70 + 44, bh = 86, bx = 960 - bw / 2, by = 790;
    c.save(); c.globalAlpha = ca; c.translate(960, by + bh / 2); c.scale(lerp(.9, 1, cp), lerp(.9, 1, cp)); c.translate(-960, -(by + bh / 2));
    c.shadowColor = 'rgba(120,61,236,.55)'; c.shadowBlur = 50; c.shadowOffsetY = 12;
    c.fillStyle = ctaGrad(bx, bx + bw); rr(bx, by, bw, bh, 20); c.fill(); c.shadowBlur = 0; c.shadowOffsetY = 0;
    c.strokeStyle = 'rgba(255,255,255,.18)'; c.lineWidth = 1.5; c.stroke();
    text(label, bx + 35, by + bh / 2 + 11, 31, { w: 600, col: '#fff' });
    icArrow(bx + bw - 50, by + bh / 2, 26, '#fff');
    // one sheen pass
    const sx = lerp(bx - 120, bx + bw + 120, prog(t, 26.7, 27.25));
    if (sx > bx - 120 && sx < bx + bw + 120) {
      c.save(); rr(bx, by, bw, bh, 20); c.clip();
      const sg = c.createLinearGradient(sx - 70, 0, sx + 70, 0); sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(.5, 'rgba(255,255,255,.25)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
      c.fillStyle = sg; c.fillRect(sx - 70, by, 140, bh); c.restore();
    }
    c.restore();
  }
  text('bankflow.bet', 960, 950, 34, { fam: HEAD, w: 500, col: P.text, align: 'center', a: .78 * eOutCubic(prog(t, 26.5, 27.1)) });
}

/* =====================================================================
   COMPOSITION
   ===================================================================== */
function drawScene(t) {
  reset(c);
  background(t);
  if (t < 4.0) S1(t);
  if (t >= 9.9 && t < 16.4) S3(t);          // dashboard sits beneath the incoming history panel
  if (t >= 4.0 && t < 10.9) S2(t);
  if (t >= 15.6 && t < 24.6) S4(t);
  if (t >= 24.0) S5(t);
  // discreet label while numbers are on screen
  const da = pulse(t, 7.3, 23.5, .4);
  if (da > 0) {
    c.save(); c.globalAlpha = da * .85;
    icInfo(1628, 1052, 16, P.mute);
    text('Dados ilustrativos', 1644, 1058, 17, { col: P.mute });
    c.restore();
  }
  // fade in from black
  const fi = 1 - prog(t, 0, .35);
  if (fi > 0) { c.fillStyle = `rgba(5,6,12,${fi})`; c.fillRect(0, 0, W, H); }
}
// fine dither noise against banding on gradients
const NOISE = Array.from({ length: 3 }, (_, k) => {
  const g = mk(256, 256), gx = g.getContext('2d'), id = gx.createImageData(256, 256), r = mulberry32(k + 11);
  for (let i = 0; i < id.data.length; i += 4) { const v = r() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  gx.putImageData(id, 0, 0); return g;
});
function renderFrame(t) {
  reset(out);
  // no subframes during the static final hold
  const n = t >= 27.4 ? 1 : SUB;
  for (let i = 0; i < n; i++) {
    drawScene(t + (n > 1 ? (i / n) * (SHUTTER / FPS) : 0));
    out.globalAlpha = 1 / (i + 1); out.drawImage(sceneC, 0, 0);
  }
  reset(out);
  const f = t >= 27.4 ? 0 : Math.floor(t * FPS);
  out.globalCompositeOperation = 'overlay'; out.globalAlpha = .035;
  out.fillStyle = out.createPattern(NOISE[f % 3], 'repeat'); out.fillRect(0, 0, W, H);
  reset(out);
}
window.renderFrame = renderFrame;
window.META = { W, H, FPS, DUR };
window.ready = Promise.all([
  document.fonts.load('700 40px "Space Grotesk"'), document.fonts.load('500 40px "Space Grotesk"'),
  document.fonts.load('500 40px "Inter"'), document.fonts.load('700 40px "Inter"'),
  new Promise(r => { if (LOGO.complete) r(); else LOGO.onload = r; }),
]).then(() => true);

if (!RENDER) {
  const audio = new Audio('bankflow-audio.wav');
  let t0 = null;
  window.ready.then(() => {
    const loop = now => { if (t0 === null) t0 = now; renderFrame(((now - t0) / 1000) % DUR); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
  cv.addEventListener('click', () => { t0 = null; audio.currentTime = 0; audio.play().catch(() => {}); });
}
</script>
